name: Revenue Opportunity CI

on:
  push:
    branches:
      - feat/revenue-opportunity-router
    paths:
      - 'tools/hermes-commerce-control/**'
      - '.github/workflows/revenue-opportunity-ci.yml'
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
    paths:
      - 'tools/hermes-commerce-control/**'
      - '.github/workflows/revenue-opportunity-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/hermes-commerce-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: tools/hermes-commerce-control/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Read-only live revenue scan
        run: node --import tsx scripts/revenue-live-scan.ts | tee /tmp/revenue-opportunities.json
      - name: Upload scan receipt
        uses: actions/upload-artifact@v4
        with:
          name: revenue-opportunities-${{ github.run_id }}
          path: /tmp/revenue-opportunities.json
          retention-days: 7
          if-no-files-found: error
