name: Robauto Claim Semantics Audit

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public frontend for claim management contract
        run: |
          node <<'NODE'
          (async () => {
          const roots = ['https://robauto.store/', 'https://robauto.ai/listings', 'https://robauto.ai/developers'];
          const needles = ['claim_token','claim-token','claimToken','/claim','/listings/','DELETE','PATCH'];
          const seen = new Set();
          const hits = [];

          async function fetchText(url) {
            const r = await fetch(url, {headers:{'user-agent':'hermes-robauto-contract-audit/1.0'}});
            const text = await r.text();
            return {r,text};
          }

          function addHit(url, text) {
            const lower = text.toLowerCase();
            for (const needle of needles) {
              let from = 0;
              while (true) {
                const i = lower.indexOf(needle.toLowerCase(), from);
                if (i < 0) break;
                const snippet = text.slice(Math.max(0,i-180), Math.min(text.length,i+320)).replace(/\s+/g,' ');
                hits.push({url, needle, snippet});
                if (hits.length >= 100) return;
                from = i + needle.length;
              }
            }
          }

          for (const root of roots) {
            try {
              const {r,text} = await fetchText(root);
              console.log(JSON.stringify({check:'page',url:root,status:r.status,finalUrl:r.url,contentType:r.headers.get('content-type'),bytes:text.length}));
              addHit(r.url,text);
              const scripts = [...text.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]);
              for (const src of scripts) {
                const u = new URL(src, r.url).href;
                if (seen.has(u)) continue;
                seen.add(u);
                try {
                  const out = await fetchText(u);
                  if (!out.r.ok) continue;
                  addHit(out.r.url,out.text);
                } catch {}
              }
            } catch (error) {
              console.log(JSON.stringify({check:'page-error',url:root,error:String(error?.message||error)}));
            }
          }

          const sanitized = hits
            .filter(x => !/[a-f0-9]{32,}/i.test(x.snippet))
            .slice(0,40);
          console.log(JSON.stringify({check:'claim-contract-search',totalHits:hits.length,safeHits:sanitized}));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
