name: Distribution Verify

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: AgentCash discovery and paid endpoint audit
        run: |
          set -euo pipefail
          npx -y @agentcash/discovery@latest discover https://hermes-counterparty-api.onrender.com --json > /tmp/agentcash.json
          npx -y @agentcash/discovery@latest check https://hermes-counterparty-api.onrender.com/v1/company-domain-intelligence --json > /tmp/agentcash-check.json
          node <<'NODE'
          const fs = require('fs');
          for (const [kind,path] of [['discover','/tmp/agentcash.json'],['check','/tmp/agentcash-check.json']]) {
            const raw = fs.readFileSync(path,'utf8');
            const parsed = JSON.parse(raw);
            const text = JSON.stringify(parsed);
            const paths = [...new Set([...text.matchAll(/\/v1\/[a-z0-9-]+(?:\/preview)?/g)].map(m=>m[0]))];
            const warningCodes = [...new Set([...text.matchAll(/"code":"([A-Z0-9_:-]+)"/g)].map(m=>m[1]))];
            console.log(JSON.stringify({source:'agentcash',kind,paths,warningCodes,hasCompany:text.includes('/v1/company-domain-intelligence'),hasPreview:text.includes('/v1/company-domain-intelligence/preview'),bytes:raw.length}));
          }
          NODE

      - name: Inspect and refresh Agent402 seller index
        run: |
          node <<'NODE'
          const origin = 'https://hermes-counterparty-api.onrender.com';
          async function getIndex(label) {
            const r = await fetch('https://agent402.tools/api/index', {headers:{'user-agent':'hermes-distribution-verifier/1.0'}});
            const body = await r.text();
            let parsed=null; try { parsed=JSON.parse(body); } catch {}
            const text=parsed?JSON.stringify(parsed):body;
            const idx=text.indexOf('hermes-counterparty-api.onrender.com');
            console.log(JSON.stringify({source:'agent402-index',label,status:r.status,hasHermes:idx>=0,context:idx>=0?text.slice(Math.max(0,idx-800),idx+2500):null}));
          }
          await getIndex('before');
          const rr = await fetch('https://agent402.tools/api/index/register', {
            method:'POST',
            headers:{'content-type':'application/json','user-agent':'hermes-distribution-verifier/1.0'},
            body:JSON.stringify({origin})
          });
          const registerBody=await rr.text();
          console.log(JSON.stringify({source:'agent402-register',status:rr.status,body:registerBody.slice(0,5000)}));
          await new Promise(r=>setTimeout(r,2000));
          await getIndex('after');
          NODE

      - name: Agent402 focused router queries
        run: |
          node <<'NODE'
          const queries = [
            'Hermes Company Domain Intelligence',
            'company domain intelligence',
            'research company domain',
            'enrich a company from its domain',
            'qualify a lead company domain'
          ];
          for (const q of queries) {
            const r = await fetch(`https://agent402.tools/api/find?q=${encodeURIComponent(q)}`, {headers:{'user-agent':'hermes-distribution-verifier/1.0'}});
            const parsed = await r.json();
            const results=Array.isArray(parsed.results)?parsed.results:[];
            const simplified=results.map((x,i)=>({rank:i+1,name:x.name,route:x.route,price:x.price,origin:x.origin??x.sellerOrigin??x.host??null,description:String(x.description??'').slice(0,180)}));
            const text=JSON.stringify(parsed);
            console.log(JSON.stringify({source:'agent402-find',q,status:r.status,count:parsed.count??results.length,hasHermes:text.includes('hermes-counterparty-api.onrender.com'),hasCompany:text.includes('/v1/company-domain-intelligence'),results:simplified}));
          }
          NODE

      - name: 402 Index focused search
        run: |
          node <<'NODE'
          for (const q of ['company domain intelligence','research company domain']) {
            const r = await fetch(`https://402index.io/api/v1/services?protocol=x402&q=${encodeURIComponent(q)}&limit=200`);
            const parsed=await r.json();
            const ours=(parsed.services??[]).filter(s=>String(s.url??'').includes('hermes-counterparty-api.onrender.com'));
            console.log(JSON.stringify({source:'402index',q,status:r.status,ours:ours.map(s=>({name:s.name,url:s.url,health:s.health_status,verified:s.x402_payment_valid,price:s.price_usd,source:s.source}))}));
          }
          NODE

      - name: x402scan recipient page inventory
        run: |
          node <<'NODE'
          const wallet='0x2BD7c4e294B09E9a853168a58712498D03A45B01';
          const r=await fetch(`https://www.x402scan.com/recipient/${wallet}/resources`,{headers:{'user-agent':'hermes-distribution-verifier/1.0'}});
          const body=await r.text();
          const urls=[...new Set([...body.matchAll(/https:\/\/hermes-counterparty-api\.onrender\.com[^"\\< ]*/g)].map(m=>m[0]))];
          console.log(JSON.stringify({source:'x402scan',status:r.status,bytes:body.length,urls,hasCompany:body.includes('/v1/company-domain-intelligence')}));
          NODE
