name: Product 10 Index Listing Check

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
    paths:
      - '.github/workflows/counterparty-seller-ci.yml'

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Check Agent402 snapshot/router and 402 Index service
        run: |
          node <<'NODE'
          const origin = 'https://hermes-counterparty-api.onrender.com';
          const hostname = 'hermes-counterparty-api.onrender.com';
          const wallet = '0x2BD7c4e294B09E9a853168a58712498D03A45B01';
          const serviceId = '3d84c0ea-8e83-4e48-8a00-35ed00cb188c';

          const snapshotResponse = await fetch('https://agent402.tools/api/index', { signal: AbortSignal.timeout(30000) });
          const snapshotText = await snapshotResponse.text();
          console.log(`AGENT402_SNAPSHOT_LOOKUP=${JSON.stringify({
            status: snapshotResponse.status,
            ok: snapshotResponse.ok,
            full_origin_found: snapshotText.includes(origin),
            hostname_found: snapshotText.includes(hostname),
            wallet_found: snapshotText.toLowerCase().includes(wallet.toLowerCase()),
            display_name_found: snapshotText.includes('Hermes Counterparty Availability'),
            snapshot_bytes: snapshotText.length,
          })}`);

          const findResponse = await fetch('https://agent402.tools/api/find?q=company%20domain%20intelligence', { signal: AbortSignal.timeout(30000) });
          const findText = await findResponse.text();
          console.log(`AGENT402_ROUTER_LOOKUP=${JSON.stringify({
            status: findResponse.status,
            ok: findResponse.ok,
            hostname_found: findText.includes(hostname),
            product_path_found: findText.includes('/v1/company-domain-intelligence'),
            response_bytes: findText.length,
            response_prefix: findText.slice(0, 1200),
          })}`);

          const indexResponse = await fetch(`https://402index.io/api/v1/services/${serviceId}`, { signal: AbortSignal.timeout(30000) });
          const indexText = await indexResponse.text();
          let indexBody = null;
          try { indexBody = JSON.parse(indexText); } catch {}
          const service = indexBody?.service ?? indexBody;
          console.log(`INDEX402_SERVICE_LOOKUP=${JSON.stringify({ status: indexResponse.status, ok: indexResponse.ok, service: service ? { id: service.id, name: service.name, url: service.url, protocol: service.protocol, price_usd: service.price_usd, payment_asset: service.payment_asset, payment_network: service.payment_network, category: service.category, provider: service.provider, status: service.status, health_status: service.health_status, probe_status: service.probe_status, http_method: service.http_method, approval_reason: service.approval_reason, verified: service.verified, domain_verified: service.domain_verified, x402_payment_valid: service.x402_payment_valid } : null })}`);

          if (!snapshotResponse.ok || !findResponse.ok || !indexResponse.ok || service?.id !== serviceId) process.exit(1);
          NODE
