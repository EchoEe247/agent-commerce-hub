name: Profiler Ranking Live Probe

on:
  push:
    branches:
      - tdd/agent402-profiler-ranking-20260820
    paths:
      - .github/workflows/profiler-ranking-live-probe.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run focused seller tests
        working-directory: products/drafts/data-quality-profiler
        run: |
          npm ci
          node --test \
            test/counterparty-availability.test.mjs \
            test/counterparty-api.test.mjs \
            test/config.test.mjs

      - name: Verify live profiler manifest metadata
        shell: bash
        run: |
          set -euo pipefail
          URL='https://hermes-counterparty-api.onrender.com/.well-known/x402'
          for attempt in $(seq 1 18); do
            code=$(curl -sS --max-time 60 -o /tmp/manifest.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = '200' ]; then
              if node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.json', 'utf8'));
          const expectedName = 'validate-json-csv-data-quality-profile-missing-duplicate-types';
          const expectedSummary = 'Validate and profile JSON or CSV datasets before ETL, RAG, analytics, or AI agent use; find missing values, duplicates and duplicate rows, inconsistent data types and type conflicts, infer field types, and return a deterministic quality score plus schema fingerprint.';
          const p = (manifest.endpoints || []).find((x) => x.path === '/v1/profile');
          if (!p) process.exit(2);
          if (p.name !== expectedName || p.summary !== expectedSummary || p.price_usd !== 0.02 || p.network !== 'eip155:8453') process.exit(3);
          fs.writeFileSync('/tmp/manifest-summary.json', JSON.stringify({
            name: p.name,
            summary: p.summary,
            method: p.method,
            path: p.path,
            priceUsd: p.price_usd,
            network: p.network,
            serviceToolCount: manifest?.capabilities?.tools ?? null,
            priceRange: manifest?.payment?.x402?.priceRange ?? null,
            payTo: manifest?.payment?.x402?.payTo ?? null,
          }, null, 2));
          NODE
              then
                break
              fi
            fi
            if [ "$attempt" = '18' ]; then
              echo 'live manifest never exposed expected profiler metadata'
              cat /tmp/manifest.json || true
              exit 1
            fi
            sleep 10
          done

      - name: Re-run three Agent402 routing queries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const ORIGIN = 'https://hermes-counterparty-api.onrender.com';
          const queries = [
            'profile JSON CSV dataset quality missing values duplicates type conflicts',
            'validate CSV data before ETL or AI agent use',
            'find missing values duplicate rows and inconsistent data types',
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const summarize = (query, data) => {
            const results = Array.isArray(data?.results) ? data.results : [];
            const index = results.findIndex((r) => r?.seller === ORIGIN);
            const hit = index >= 0 ? results[index] : null;
            return {
              query,
              found: index >= 0,
              rank: index >= 0 ? index + 1 : null,
              score: hit?.score ?? hit?.why?.score ?? null,
              slug: hit?.slug ?? null,
              name: hit?.name ?? null,
              priceUsd: hit?.priceUsd ?? hit?.price ?? null,
              matchedOn: hit?.why?.matchedOn ?? null,
              health: hit?.health ?? hit?.why?.health ?? null,
              top3: results.slice(0, 3).map((r, i) => ({
                rank: i + 1,
                seller: r?.seller ?? null,
                slug: r?.slug ?? null,
                score: r?.score ?? r?.why?.score ?? null,
                priceUsd: r?.priceUsd ?? r?.price ?? null,
              })),
            };
          };

          let summaries = [];
          let allFound = false;
          let lastError = null;
          for (let attempt = 1; attempt <= 16; attempt++) {
            summaries = [];
            lastError = null;
            for (const query of queries) {
              try {
                const response = await fetch('https://agent402.tools/api/route', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ query, top: 10, include: 'external' }),
                  signal: AbortSignal.timeout(60000),
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                summaries.push(summarize(query, data));
              } catch (error) {
                lastError = String(error?.message || error);
                summaries.push({ query, found: false, rank: null, error: lastError, top3: [] });
              }
            }
            allFound = summaries.every((x) => x.found);
            if (allFound) break;
            if (attempt < 16) await sleep(30000);
          }

          fs.writeFileSync('/tmp/ranking-summary.json', JSON.stringify({
            allFound,
            lastError,
            queries: summaries,
          }, null, 2));
          NODE

      - name: Persist compact verification evidence on probe branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/raw/agent402-profiler-ranking
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest-summary.json', 'utf8'));
          const ranking = JSON.parse(fs.readFileSync('/tmp/ranking-summary.json', 'utf8'));
          const evidence = {
            observedAt: new Date().toISOString(),
            productionCommit: 'eed85dfa2e91d9b041758dab6f25c12b101e3db1',
            focusedTests: 'PASS',
            origin: 'https://hermes-counterparty-api.onrender.com',
            manifest,
            agent402: ranking,
          };
          fs.writeFileSync('research/raw/agent402-profiler-ranking/latest.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add research/raw/agent402-profiler-ranking/latest.json
          git commit -m 'chore: record profiler Agent402 ranking verification'
          git push origin HEAD:tdd/agent402-profiler-ranking-20260820
