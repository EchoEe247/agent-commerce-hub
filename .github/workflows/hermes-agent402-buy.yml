name: Hermes Agent402 Buyer (safe preparation only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates the live 402; production purchases are disabled in public Actions"
        required: true
        type: choice
        options:
          - dry-run
        default: dry-run
      endpointId:
        description: "Allowlisted Agent402 intelligence endpoint"
        required: true
        type: choice
        options:
          - demand-radar
          - bestsellers
        default: demand-radar
      purchaseId:
        description: "Unique idempotency / ledger ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-agent402-production-spend
  cancel-in-progress: false

jobs:
  buy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: products/drafts/data-quality-profiler/package-lock.json
      - name: Install dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci
      - name: Fail closed before any purchase
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" != "dry-run" ]; then
            echo "PUBLIC_ACTIONS_PURCHASE_DISABLED: production purchases are not permitted from public GitHub Actions."
            exit 1
          fi
      - name: Run bounded Agent402 buyer (dry-run only)
        working-directory: products/drafts/data-quality-profiler
        env:
          MODE: ${{ inputs.mode }}
          ENDPOINT_ID: ${{ inputs.endpointId }}
          PURCHASE_ID: ${{ inputs.purchaseId }}
        run: node scripts/agent402-production-buyer.mjs
