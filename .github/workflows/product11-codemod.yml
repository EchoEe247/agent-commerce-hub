name: Product 11 Codemod

on:
  push:
    branches:
      - feat/sec-company-snapshot
    paths:
      - '.github/workflows/product11-codemod.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sec-company-snapshot
      - name: Add Product 11 price config
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('products/drafts/data-quality-profiler/src/config.mjs')
          s = p.read_text()
          if 'x402SecCompanyPrice:' not in s:
              s = s.replace('    x402CompanyDomainPrice: env.X402_COMPANY_DOMAIN_PRICE ?? "$0.02",\n', '    x402CompanyDomainPrice: env.X402_COMPANY_DOMAIN_PRICE ?? "$0.02",\n    x402SecCompanyPrice: env.X402_SEC_COMPANY_PRICE ?? "$0.02",\n', 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add products/drafts/data-quality-profiler/src/config.mjs
          git commit -m 'feat: add Product 11 price config' || true
          git push origin HEAD:feat/sec-company-snapshot
# retrigger-price
