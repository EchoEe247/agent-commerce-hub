name: Robauto Actions Log Cleanup

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete historical Robauto workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          WORKFLOW_ID: '341345873'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['REPO']
          workflow=int(os.environ['WORKFLOW_ID'])
          current=int(os.environ['CURRENT_RUN'])
          raw=subprocess.check_output([
              'gh','api','--method','GET',f'repos/{repo}/actions/runs','-f','per_page=100'
          ], text=True)
          data=json.loads(raw)
          runs=data.get('workflow_runs',[])
          targets=[int(r['id']) for r in runs if int(r.get('workflow_id') or 0)==workflow and int(r['id']) != current]
          deleted=[]
          for run_id in targets:
              subprocess.run(['gh','api','--method','DELETE',f'repos/{repo}/actions/runs/{run_id}'],check=True)
              deleted.append(run_id)
          print(json.dumps({'check':'robauto-run-log-cleanup','current_run':current,'found_historical':len(targets),'deleted_count':len(deleted),'deleted_run_ids':deleted}))
          PY
