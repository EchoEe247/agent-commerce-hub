name: Postmerge Discovery Verify

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live OpenAPI and Agent402 cross-seller rank
        run: |
          node <<'NODE'
          const origin = 'https://hermes-counterparty-api.onrender.com';
          const host = 'hermes-counterparty-api.onrender.com';
          const expectedSlug = 'companyDomainIntelligenceEnrichment';
          const expectedSummary = 'Company domain intelligence: research and enrich a business domain with public web and infrastructure signals';

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const getJson = async url => {
            const r = await fetch(url, { headers: { 'user-agent': 'hermes-postmerge-discovery-verifier/1.0' } });
            const text = await r.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`${url} returned non-JSON status=${r.status}: ${text.slice(0,300)}`); }
            if (!r.ok) throw new Error(`${url} status=${r.status}: ${text.slice(0,300)}`);
            return body;
          };

          const openapi = await getJson(`${origin}/openapi.json`);
          const company = openapi.paths?.['/v1/company-domain-intelligence']?.post;
          const preview = openapi.paths?.['/v1/company-domain-intelligence/preview']?.post;
          if (!company) throw new Error('live OpenAPI missing paid company-domain-intelligence');
          if (company.operationId !== expectedSlug) throw new Error(`live operationId=${company.operationId}`);
          if (company.summary !== expectedSummary) throw new Error(`live summary=${company.summary}`);
          if (company['x-payment-info']?.price?.amount !== '0.020000') throw new Error(`live paid price=${company['x-payment-info']?.price?.amount}`);
          if (!preview) throw new Error('live OpenAPI missing free preview');
          if (preview['x-payment-info'] !== undefined || preview.responses?.['402'] !== undefined) throw new Error('free preview unexpectedly advertises payment');
          console.log(JSON.stringify({check:'live-openapi', operationId:company.operationId, summary:company.summary, price:company['x-payment-info'].price.amount, previewFree:true}));

          async function route(q) {
            const body = await getJson(`https://agent402.tools/api/route?q=${encodeURIComponent(q)}&include=external&top=25`);
            const results = Array.isArray(body.results) ? body.results : [];
            const rank = results.findIndex(x => String(x.seller ?? '').includes(host) || String(x.url ?? '').includes(host));
            return { body, results, rank: rank >= 0 ? rank + 1 : null, hit: rank >= 0 ? results[rank] : null };
          }

          let companyRank = null;
          let enrichRank = null;
          let companyHit = null;
          let enrichHit = null;
          let propagated = false;
          for (let attempt = 1; attempt <= 24; attempt++) {
            const c = await route('company domain intelligence');
            const e = await route('enrich a business domain');
            companyRank = c.rank; enrichRank = e.rank; companyHit = c.hit; enrichHit = e.hit;
            const seen = companyHit?.slug === expectedSlug || enrichHit?.slug === expectedSlug;
            console.log(JSON.stringify({attempt, propagated:seen, companyRank, companySlug:companyHit?.slug ?? null, companyScore:companyHit?.score ?? null, enrichRank, enrichSlug:enrichHit?.slug ?? null, enrichScore:enrichHit?.score ?? null}));
            if (seen) { propagated = true; break; }
            await sleep(15000);
          }
          if (!propagated) throw new Error('Agent402 did not crawl the new company enrichment metadata');
          if (companyRank == null || companyRank > 3) throw new Error(`company-domain-intelligence rank regressed to ${companyRank}`);
          if (enrichRank == null || enrichRank > 5) throw new Error(`generic enrichment rank is still too weak: ${enrichRank}`);
          console.log(JSON.stringify({check:'agent402-rank', companyRank, company:companyHit, enrichRank, enrich:enrichHit}));
          NODE
