name: Product 12 Portfolio Green

on:
  push:
    branches:
      - feat/product12-dependency-vulnerability
    paths:
      - '.github/workflows/product12-portfolio-green.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product12-dependency-vulnerability
      - name: Advance permanent portfolio assertions to twelve
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('products/drafts/data-quality-profiler/test/agent402-manifest.test.mjs')
          s = p.read_text()
          s = s.replace('test("manifest exposes all eleven POST tools including Product 11"', 'test("manifest exposes all twelve POST tools including Product 12"')
          s = s.replace('assert.equal(body.resources.length, 11);', 'assert.equal(body.resources.length, 12);')
          s = s.replace('assert.equal(new Set(body.resources.map((resource) => resource.url)).size, 11);', 'assert.equal(new Set(body.resources.map((resource) => resource.url)).size, 12);')
          s = s.replace('assert.equal(body.capabilities.tools, 11);', 'assert.equal(body.capabilities.tools, 12);')
          p.write_text(s)

          p = Path('products/drafts/data-quality-profiler/test/counterparty-api.test.mjs')
          s = p.read_text()
          s = s.replace('test("GET /.well-known/x402 publishes eleven unique Agent402-compatible tools"', 'test("GET /.well-known/x402 publishes twelve unique Agent402-compatible tools"')
          s = s.replace('assert.equal(body.resources.length, 11);', 'assert.equal(body.resources.length, 12);')
          s = s.replace('assert.equal(new Set(body.resources.map((resource) => resource.url)).size, 11);', 'assert.equal(new Set(body.resources.map((resource) => resource.url)).size, 12);')
          old = '    { url: `${PUBLIC_ORIGIN}/v1/sec-company-snapshot`, method: "POST" },\n'
          new = old + '    { url: `${PUBLIC_ORIGIN}/v1/dependency-vulnerability-check`, method: "POST" },\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          s = s.replace('assert.equal(body.capabilities.tools, 11);', 'assert.equal(body.capabilities.tools, 12);')
          s = s.replace('["business-intelligence", "compliance", "data-quality"]', '["business-intelligence", "compliance", "software-security", "data-quality"]')
          old = '  assert.equal(body.capabilities.categories.find((category) => category.key === "compliance").tools, 1);\n'
          new = old + '  assert.equal(body.capabilities.categories.find((category) => category.key === "software-security").tools, 1);\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('products/drafts/data-quality-profiler/test/openapi-discovery.test.mjs')
          s = p.read_text()
          old = '  ["/v1/sec-company-snapshot", "secCompanySnapshot", "0.020000"],\n'
          new = old + '  ["/v1/dependency-vulnerability-check", "dependencyVulnerabilityCheck", "0.015000"],\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '      x402SecCompanyPrice: "$0.02",\n'
          new = old + '      x402DependencyVulnerabilityPrice: "$0.015",\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          s = s.replace('test("GET /openapi.json publishes eleven AgentCash-compatible x402 operations"', 'test("GET /openapi.json publishes twelve AgentCash-compatible x402 operations"')
          s = s.replace('/eleven POST operations/i', '/twelve POST operations/i')
          p.write_text(s)

          p = Path('products/drafts/data-quality-profiler/test/sec-company-snapshot-discovery.test.mjs')
          s = p.read_text()
          s = s.replace('// Product #11 discovery and paid-surface contract; portfolio totals are now eleven.', '// Product #11 remains stable while portfolio totals advance to twelve.')
          s = s.replace('test("Product 11 is published as the eleventh OpenAPI paid operation"', 'test("Product 11 remains published after Product 12 in OpenAPI"')
          s = s.replace('assert.equal(Object.keys(document.paths).length, 11);', 'assert.equal(Object.keys(document.paths).length, 12);')
          s = s.replace('/eleven POST operations/i', '/twelve POST operations/i')
          s = s.replace('test("Product 11 is published as the eleventh Agent402 manifest tool"', 'test("Product 11 remains published after Product 12 in the Agent402 manifest"')
          s = s.replace('assert.equal(body.resources.length, 11);', 'assert.equal(body.resources.length, 12);')
          s = s.replace('assert.equal(body.capabilities.tools, 11);', 'assert.equal(body.capabilities.tools, 12);')
          p.write_text(s)
          PY
          git diff --check
          git diff -- products/drafts/data-quality-profiler/test/agent402-manifest.test.mjs products/drafts/data-quality-profiler/test/counterparty-api.test.mjs products/drafts/data-quality-profiler/test/openapi-discovery.test.mjs products/drafts/data-quality-profiler/test/sec-company-snapshot-discovery.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/drafts/data-quality-profiler/test/agent402-manifest.test.mjs products/drafts/data-quality-profiler/test/counterparty-api.test.mjs products/drafts/data-quality-profiler/test/openapi-discovery.test.mjs products/drafts/data-quality-profiler/test/sec-company-snapshot-discovery.test.mjs
          git commit -m "test: advance portfolio discovery assertions to twelve"
          git push origin HEAD:feat/product12-dependency-vulnerability
