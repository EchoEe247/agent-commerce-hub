name: Product 12 TDD

on:
  push:
    branches:
      - feat/product12-dependency-vulnerability
    paths:
      - '.github/workflows/product12-tdd.yml'
      - 'products/drafts/data-quality-profiler/test/dependency-vulnerability-check.test.mjs'
      - 'products/drafts/data-quality-profiler/src/app.mjs'
      - 'products/drafts/data-quality-profiler/src/dependency-vulnerability-check.mjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci
      - name: Product 12 seam
        working-directory: products/drafts/data-quality-profiler
        run: node --test test/dependency-vulnerability-check.test.mjs
