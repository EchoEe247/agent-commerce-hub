name: Product 13 Release Verification

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
    paths:
      - '.github/workflows/product13-release.yml'

permissions:
  contents: read

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/product13-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Query 402 Index for exact Product 13 listing
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = 'https://hermes-counterparty-api.onrender.com/v1/package-maintenance-snapshot';
          const queries = [endpoint, 'Hermes Package Maintenance Snapshot', 'package-maintenance-snapshot'];
          const receipt = {
            checked_at: new Date().toISOString(),
            endpoint,
            paid_call_executed: false,
            registration_attempted: false,
            queries: [],
            listing: null,
          };
          for (const q of queries) {
            const url = new URL('https://402index.io/api/v1/services');
            url.searchParams.set('protocol', 'x402');
            url.searchParams.set('q', q);
            url.searchParams.set('limit', '100');
            const res = await fetch(url);
            const text = await res.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 2000) }; }
            const services = Array.isArray(body?.services) ? body.services : [];
            receipt.queries.push({ q, status: res.status, result_count: services.length, total: body?.total ?? null });
            const exact = services.find((service) => String(service?.url ?? '').replace(/\/$/, '') === endpoint);
            if (exact) {
              receipt.listing = {
                id: exact.id,
                name: exact.name,
                url: exact.url,
                protocol: exact.protocol,
                price_usd: exact.price_usd,
                payment_asset: exact.payment_asset,
                payment_network: exact.payment_network,
                category: exact.category,
                provider: exact.provider,
                source: exact.source,
                health_status: exact.health_status,
                probe_status: exact.probe_status,
                http_method: exact.http_method,
                x402_payment_valid: exact.x402_payment_valid,
                x402_facilitator_reachable: exact.x402_facilitator_reachable,
                x402_asset_known: exact.x402_asset_known,
                domain_verified: exact.domain_verified,
                last_checked: exact.last_checked,
                reliability_score: exact.reliability_score,
              };
              break;
            }
          }
          receipt.success = Boolean(receipt.listing);
          console.log('PRODUCT13_402INDEX_LOOKUP_BEGIN');
          console.log(JSON.stringify(receipt, null, 2));
          console.log('PRODUCT13_402INDEX_LOOKUP_END');
          if (!receipt.success) process.exitCode = 1;
          NODE
