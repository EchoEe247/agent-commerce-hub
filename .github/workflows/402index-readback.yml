name: 402 Index Readback

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
    paths:
      - '.github/workflows/402index-readback.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all paid Hermes endpoints are indexed
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://hermes-counterparty-api.onrender.com';
          const openapiResponse = await fetch(`${origin}/openapi.json`);
          if (!openapiResponse.ok) throw new Error(`OpenAPI fetch failed: ${openapiResponse.status}`);
          const openapi = await openapiResponse.json();
          const expected = Object.entries(openapi?.paths ?? {})
            .filter(([, item]) => item?.post?.['x-payment-info'])
            .map(([path]) => `${origin}${path}`)
            .sort();
          if (expected.length !== 13) throw new Error(`Expected 13 paid endpoints, got ${expected.length}`);

          const url = new URL('https://402index.io/api/v1/services');
          url.searchParams.set('q', 'Hermes Agent Commerce API');
          url.searchParams.set('protocol', 'x402');
          url.searchParams.set('limit', '200');
          const response = await fetch(url);
          if (!response.ok) throw new Error(`402 Index search failed: ${response.status}`);
          const data = await response.json();
          const rows = Array.isArray(data) ? data : (data.services || data.results || data.data || []);
          const originRows = rows.filter((row) => String(row.url || row.endpoint || '').startsWith(origin));
          const observed = [...new Set(originRows.map((row) => String(row.url || row.endpoint || '')))].sort();
          const missing = expected.filter((item) => !observed.includes(item));

          console.log(`EXPECTED_PAID=${expected.length}`);
          console.log(`OBSERVED_ORIGIN_ROWS=${originRows.length}`);
          console.log(`OBSERVED_UNIQUE_URLS=${observed.length}`);
          for (const row of originRows) {
            console.log(`INDEXED ${JSON.stringify({url:row.url,name:row.name,source:row.source,status:row.status,health_status:row.health_status,provider:row.provider})}`);
          }
          if (missing.length) {
            for (const item of missing) console.log(`MISSING ${item}`);
            throw new Error(`402 Index coverage incomplete: ${missing.length} missing`);
          }
          console.log('INDEX402_FULL_COVERAGE=PASS');
          NODE
