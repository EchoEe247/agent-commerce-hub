name: Postmerge CDP Compatibility Verify

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live XPay compatibility after optional CDP merge
        run: |
          node <<'NODE'
          (async()=>{
            const origin='https://hermes-counterparty-api.onrender.com';
            const headers={'content-type':'application/json','user-agent':'hermes-postmerge-cdp-compat/1.0'};
            const payload=JSON.stringify({domain:'stripe.com'});

            const health=await fetch(`${origin}/health`,{headers:{'user-agent':headers['user-agent']}});
            if(health.status!==200) throw new Error(`health status=${health.status}`);

            const preview=await fetch(`${origin}/v1/company-domain-intelligence/preview`,{method:'POST',headers,body:payload});
            const previewText=await preview.text();
            if(preview.status!==200) throw new Error(`preview status=${preview.status} body=${previewText.slice(0,300)}`);
            if(preview.headers.get('payment-required')) throw new Error('preview unexpectedly has PAYMENT-REQUIRED');
            const previewBody=JSON.parse(previewText);
            if(previewBody.preview!==true) throw new Error('preview flag missing');
            if(previewBody?.upgrade?.price_usd!==0.02) throw new Error(`preview upgrade price=${previewBody?.upgrade?.price_usd}`);

            const paid=await fetch(`${origin}/v1/company-domain-intelligence`,{method:'POST',headers,body:payload});
            const paidText=await paid.text();
            if(paid.status!==402) throw new Error(`paid status=${paid.status} body=${paidText.slice(0,300)}`);
            const encoded=paid.headers.get('payment-required');
            if(!encoded) throw new Error('paid route missing PAYMENT-REQUIRED');
            const decoded=JSON.parse(Buffer.from(encoded,'base64').toString('utf8'));
            const quote=decoded.accepts?.[0];
            if(decoded.x402Version!==2) throw new Error(`x402Version=${decoded.x402Version}`);
            if(quote?.scheme!=='exact') throw new Error(`scheme=${quote?.scheme}`);
            if(quote?.network!=='eip155:8453') throw new Error(`network=${quote?.network}`);
            if(quote?.amount!=='20000') throw new Error(`amount=${quote?.amount}`);
            if(quote?.payTo?.toLowerCase()!=='0x2bd7c4e294b09e9a853168a58712498d03a45b01') throw new Error(`payTo=${quote?.payTo}`);
            if(!decoded.extensions?.bazaar) throw new Error('Bazaar discovery extension missing from live 402');

            console.log(JSON.stringify({
              check:'postmerge-xpay-compat',
              health:health.status,
              previewStatus:preview.status,
              previewFree:true,
              paidStatus:paid.status,
              x402Version:decoded.x402Version,
              network:quote.network,
              amount:quote.amount,
              bazaar:Boolean(decoded.extensions?.bazaar)
            }));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
