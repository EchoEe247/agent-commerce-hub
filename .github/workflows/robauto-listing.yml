name: Robauto Final Listing Verification

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify five public Hermes listings without claim credentials
        run: |
          node <<'NODE'
          (async()=>{
            const api='https://robauto.store/api/public/listings';
            const origin='https://hermes-counterparty-api.onrender.com';
            const handle='hermes-commerce-api';
            const expected=new Map([
              ['/v1/company-domain-intelligence',0.02],
              ['/v1/entity-sanctions-screen',0.02],
              ['/v1/profile',0.02],
              ['/v1/dependency-vulnerability-check',0.005],
              ['/v1/package-maintenance-snapshot',0.005]
            ]);
            async function get(url){
              const r=await fetch(url,{headers:{'user-agent':'hermes-robauto-final-verify/1.0'}});
              const text=await r.text();
              if(!r.ok)throw new Error(`${url} status=${r.status}`);
              return JSON.parse(text);
            }
            const board=await get(api);
            const rows=Array.isArray(board)?board:(board.listings||board.items||board.results||board.data||[]);
            const ours=rows.filter(x=>x.agent_handle===handle);
            if(ours.length!==5)throw new Error(`expected 5 listings, got ${ours.length}`);
            for(const [path,price] of expected){
              const hit=ours.find(x=>x.endpoint===`${origin}${path}`);
              if(!hit)throw new Error(`missing ${path}`);
              if(Number(hit.price_usdc)!==price)throw new Error(`price drift ${path}: ${hit.price_usdc} != ${price}`);
            }
            const manifest=await get(`${origin}/.well-known/x402`);
            if(manifest.name!=='Hermes Agent Commerce API'||manifest.endpoints?.length!==13)throw new Error('live Hermes manifest contract changed');
            for(const [path,price] of expected){
              const live=manifest.endpoints.find(x=>x.path===path);
              if(!live||Number(live.price_usd)!==price)throw new Error(`Robauto/live mismatch ${path}`);
            }
            console.log(JSON.stringify({check:'robauto-final-verification',verified:true,count:ours.length,listings:ours.map(x=>({id:x.id,title:x.title,endpoint:x.endpoint,price_usdc:x.price_usdc}))}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
