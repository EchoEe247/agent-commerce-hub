name: Postmerge Seller Identity Verify

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live seller identity and Agent402 crawl
        run: |
          node <<'NODE'
          const origin = 'https://hermes-counterparty-api.onrender.com';
          const host = 'hermes-counterparty-api.onrender.com';
          const expectedSeller = 'Hermes Agent Commerce API';
          const expectedSlug = 'companyDomainIntelligenceEnrichment';
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function getJson(url) {
            const r = await fetch(url, { headers: { 'user-agent': 'hermes-postmerge-seller-identity-verifier/1.0' } });
            const text = await r.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`${url} non-JSON status=${r.status}: ${text.slice(0,300)}`); }
            if (!r.ok) throw new Error(`${url} status=${r.status}: ${text.slice(0,300)}`);
            return body;
          }

          const manifest = await getJson(`${origin}/.well-known/x402`);
          if (manifest.name !== expectedSeller) throw new Error(`live manifest seller=${manifest.name}`);
          if (!Array.isArray(manifest.resources) || manifest.resources.length !== 13) throw new Error(`live manifest resources=${manifest.resources?.length}`);
          const company = manifest.endpoints?.find(x => x.path === '/v1/company-domain-intelligence');
          if (!company) throw new Error('live manifest missing company-domain-intelligence');
          if (!/research and enrich a business domain/i.test(company.summary || '')) throw new Error(`live company summary=${company.summary}`);
          console.log(JSON.stringify({check:'live-manifest', name:manifest.name, resources:manifest.resources.length, companySummary:company.summary}));

          async function route(q) {
            const body = await getJson(`https://agent402.tools/api/route?q=${encodeURIComponent(q)}&include=external&top=25`);
            const results = Array.isArray(body.results) ? body.results : [];
            const i = results.findIndex(x => String(x.seller ?? '').includes(host) || String(x.url ?? '').includes(host));
            return { rank: i >= 0 ? i + 1 : null, hit: i >= 0 ? results[i] : null };
          }

          let companyRoute;
          let enrichRoute;
          let propagated = false;
          for (let attempt = 1; attempt <= 24; attempt++) {
            companyRoute = await route('company domain intelligence');
            enrichRoute = await route('enrich a business domain');
            const sellerName = companyRoute.hit?.sellerName ?? enrichRoute.hit?.sellerName ?? null;
            const slug = companyRoute.hit?.slug ?? enrichRoute.hit?.slug ?? null;
            console.log(JSON.stringify({attempt, sellerName, slug, companyRank:companyRoute.rank, enrichRank:enrichRoute.rank}));
            if (sellerName === expectedSeller && slug === expectedSlug) { propagated = true; break; }
            await sleep(15000);
          }
          if (!propagated) throw new Error(`Agent402 did not propagate seller identity; company=${JSON.stringify(companyRoute?.hit)} enrich=${JSON.stringify(enrichRoute?.hit)}`);
          if (companyRoute.rank == null || companyRoute.rank > 3) throw new Error(`company rank regressed to ${companyRoute.rank}`);
          if (enrichRoute.rank == null || enrichRoute.rank > 5) throw new Error(`enrich rank regressed to ${enrichRoute.rank}`);
          console.log(JSON.stringify({check:'agent402-seller-identity', companyRank:companyRoute.rank, enrichRank:enrichRoute.rank, sellerName:companyRoute.hit?.sellerName, slug:companyRoute.hit?.slug}));
          NODE
