name: Product 10 x402 Green

on:
  push:
    branches:
      - feat/company-domain-intelligence
    paths:
      - '.github/workflows/product10-x402-green.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect Product 10 with x402 and Bazaar metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('products/drafts/data-quality-profiler/src/payments/x402-plugin.mjs')
          s = p.read_text()
          marker = '    const duplicateAuditBazaarExtension = declareDiscoveryExtension({\n'
          block = '''    const companyDomainBazaarExtension = declareDiscoveryExtension({\n      bodyType: "json",\n      input: { domain: "stripe.com" },\n      inputSchema: {\n        type: "object",\n        properties: {\n          domain: {\n            type: "string",\n            minLength: 1,\n            maxLength: 253,\n            description: "Public company domain name, for example stripe.com",\n          },\n        },\n        required: ["domain"],\n      },\n      output: {\n        example: {\n          schema_version: "1.0",\n          query: { domain: "stripe.com", normalized_domain: "stripe.com" },\n          company: { display_name: "Stripe", source: "og:site_name", confidence: "high" },\n          domain: { registered: true, registrar: null, registration_date: null, expiration_date: null, age_days: null, statuses: [], nameservers: [] },\n          website: { reachable: true, https: true, status_code: 200, final_url: "https://stripe.com/", redirect_chain: [], title: null, description: null, canonical_url: null, social_links: [], contact_links: [] },\n          dns: { has_a: true, has_aaaa: false, addresses: [], ipv6_addresses: [] },\n          mail: { has_mx: true, mx: [], spf_present: true, dmarc_present: true },\n          security: { hsts: true, content_security_policy: true },\n          sources: { dns: "system-resolver", rdap: "https://rdap.org/domain/stripe.com", website: "https://stripe.com/" },\n          warnings: [],\n        },\n      },\n    });\n\n'''
          if marker not in s:
              raise SystemExit('Bazaar insertion marker not found')
          s = s.replace(marker, block + marker, 1)
          route_marker = '      "POST /v1/duplicate-audit": protectedRoute(\n'
          route_block = '''      "POST /v1/company-domain-intelligence": protectedRoute(\n        config,\n        config.x402CompanyDomainPrice,\n        "Enrich a public company domain with DNS, MX/SPF/DMARC, RDAP registration, website identity metadata, social/contact links, and security-header signals",\n        companyDomainBazaarExtension\n      ),\n'''
          if route_marker not in s:
              raise SystemExit('x402 route insertion marker not found')
          s = s.replace(route_marker, route_block + route_marker, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add products/drafts/data-quality-profiler/src/payments/x402-plugin.mjs
          git commit -m 'feat: protect Product 10 with x402'
          git push origin HEAD:feat/company-domain-intelligence
