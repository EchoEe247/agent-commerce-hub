name: Hermes Commerce Control CI

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
      - main
    paths:
      - 'tools/hermes-commerce-control/**'
      - '.github/workflows/hermes-commerce-control-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/hermes-commerce-control/package-lock.json
      - name: Install dependencies
        working-directory: tools/hermes-commerce-control
        run: npm ci
      - name: Typecheck
        working-directory: tools/hermes-commerce-control
        run: npm run typecheck
      - name: Build
        working-directory: tools/hermes-commerce-control
        run: npm run build
      - name: Test
        working-directory: tools/hermes-commerce-control
        run: npm test
      - name: Verify package boundary
        working-directory: tools/hermes-commerce-control
        run: npm run test:package
