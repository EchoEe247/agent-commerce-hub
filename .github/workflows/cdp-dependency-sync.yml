name: CDP Dependency Sync

on:
  push:
    branches:
      - feat/cdp-bazaar-facilitator

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'chore: sync coinbase x402 dependency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cdp-bazaar-facilitator
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact Coinbase x402 facilitator package
        working-directory: products/drafts/data-quality-profiler
        run: npm install --save-exact @coinbase/x402@2.1.0
      - name: Commit generated package metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/drafts/data-quality-profiler/package.json products/drafts/data-quality-profiler/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'chore: sync coinbase x402 dependency'
          git push origin HEAD:feat/cdp-bazaar-facilitator
