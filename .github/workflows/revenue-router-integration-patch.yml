name: Revenue Router Integration Patch

on:
  push:
    branches:
      - feat/revenue-opportunity-router
    paths:
      - '.github/workflows/revenue-router-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/revenue-opportunity-router
      - name: Integrate eighth public source and update contracts
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          cli = 'tools/hermes-commerce-control/src/cli.ts'
          replace(cli,
              'import { BountyBookAdapter } from "./adapters/bountybook/index.js";\nimport { The402Adapter }',
              'import { BountyBookAdapter } from "./adapters/bountybook/index.js";\nimport { TryBountyAdapter } from "./adapters/trybounty/index.js";\nimport { The402Adapter }')
          replace(cli,
              '/** Injected adapters. Defaults to the seven production adapters. */',
              '/** Injected adapters. Defaults to the eight production/read-only adapters. */')
          replace(cli,
              '    new BountyBookAdapter(),\n    new The402Adapter',
              '    new BountyBookAdapter(),\n    new TryBountyAdapter(config.adapters.trybounty.baseUrl),\n    new The402Adapter')

          ranking = 'tools/hermes-commerce-control/src/ranking/work.ts'
          replace(ranking,
              '  bountybook: 0.65,\n  the402: 0.5,',
              '  bountybook: 0.65,\n  trybounty: 0.6,\n  the402: 0.5,')

          config_test = 'tools/hermes-commerce-control/test/config.test.ts'
          replace(config_test,
              '    "bountybook",\n    "the402",',
              '    "bountybook",\n    "trybounty",\n    "the402",')

          cli_test = 'tools/hermes-commerce-control/test/cli.test.ts'
          replace(cli_test,
              'assert.equal(sources.length, 7, "all seven platforms must be listed");',
              'assert.equal(sources.length, 8, "all eight platforms must be listed");')
          replace(cli_test,
              '        "bountybook",\n        "cdp_bazaar",',
              '        "bountybook",\n        "cdp_bazaar",\n        "trybounty",')

          mcp_test = 'tools/hermes-commerce-control/test/mcp.test.ts'
          replace(mcp_test,
              'test("MCP: commerce_sources lists all seven platforms", async () => {',
              'test("MCP: commerce_sources lists all eight platforms", async () => {')
          replace(mcp_test,
              '      assert.equal(data.count, 7);',
              '      assert.equal(data.count, 8);')

          doctor_test = 'tools/hermes-commerce-control/test/doctor.test.ts'
          replace(doctor_test, '/3 of 7/', '/3 of 8/')

          readme = 'tools/hermes-commerce-control/README.md'
          replace(readme,
              'The control plane coordinates with seven decentralized machine commerce platforms through lightweight adapters:',
              'The control plane coordinates with eight machine-commerce and bounty discovery platforms through lightweight adapters:')
          replace(readme,
              '### Secondary Adapters\n- **BountyBook:** Index open jobs, budgets, and criteria.',
              '### Secondary Adapters\n- **BountyBook:** Index open jobs, budgets, and criteria.\n- **TryBounty:** Read-only scan of the public Recent Jobs board; payout/onboarding details remain unresolved and no claim path is exposed.')

          Path('.github/workflows/revenue-router-integration-patch.yml').unlink()
      - name: Commit bounded integration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(revenue): integrate TryBounty into control plane"
          git push origin HEAD:feat/revenue-opportunity-router
