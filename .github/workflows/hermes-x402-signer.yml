name: Hermes x402 External Signer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target Platform (e.g. Agent402)"
        required: true
        default: "Agent402"
      purchaseId:
        description: "Unique Purchase ID for tracking"
        required: true
      endpointId:
        description: "Endpoint to query"
        required: true
        default: "demand-radar"
      expectedMaximumAmount:
        description: "Expected maximum amount (raw atomic USDC)"
        required: true
        default: "20000"
      network:
        description: "Network (testnet only: eip155:84532)"
        required: true
        type: choice
        options:
          - eip155:84532
        default: "eip155:84532"

permissions:
  contents: read

concurrency:
  group: x402-signing
  cancel-in-progress: false

jobs:
  sign-and-settle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: products/published/data-quality-profiler/package-lock.json
      - name: Install dependencies in profiler
        working-directory: products/published/data-quality-profiler
        run: npm ci
      - name: Initialize authoritative testnet financial store from audit snapshot
        working-directory: products/published/data-quality-profiler
        env:
          TESTNET_DB_PATH: ${{ runner.temp }}/testnet-budget.sqlite
        run: |
          node scripts/financial-store-admin.mjs init-testnet \
            --db "$TESTNET_DB_PATH"
      - name: Execute signer and live testnet purchase
        working-directory: products/published/data-quality-profiler
        env:
          PLATFORM: ${{ inputs.platform }}
          PURCHASE_ID: ${{ inputs.purchaseId }}
          ENDPOINT_ID: ${{ inputs.endpointId }}
          EXPECTED_MAXIMUM_AMOUNT: ${{ inputs.expectedMaximumAmount }}
          NETWORK: ${{ inputs.network }}
          HERMES_COMMERCE_SPEND_TEST_PRIVATE_KEY: ${{ secrets.HERMES_COMMERCE_SPEND_TEST_PRIVATE_KEY }}
          HERMES_FINANCIAL_DB_PATH: ${{ runner.temp }}/testnet-budget.sqlite
          WORKFLOW_DISPATCH_TIME: ${{ github.event.repository.pushed_at }}
        run: node scripts/github-actions-signer.mjs
      - name: Export validated audit snapshot from authoritative store
        working-directory: products/published/data-quality-profiler
        env:
          TESTNET_DB_PATH: ${{ runner.temp }}/testnet-budget.sqlite
        run: |
          node scripts/financial-store-admin.mjs export-testnet \
            --db "$TESTNET_DB_PATH"
      - name: Commit testnet audit snapshot to run-scoped branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BRANCH: testnet-audit/run-${{ github.run_id }}-${{ github.run_attempt }}
          PURCHASE_ID: ${{ inputs.purchaseId }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/commerce-control/ledgers/testnet-budget-ledger.json
          if git diff --cached --quiet; then
            echo "No audit snapshot change to persist."
            exit 0
          fi
          git commit -m "chore: record testnet financial audit snapshot for $PURCHASE_ID"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push "https://github.com/${REPOSITORY}.git" "HEAD:refs/heads/${AUDIT_BRANCH}"
          printf 'Testnet audit snapshot branch: `%s`\n' "$AUDIT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
