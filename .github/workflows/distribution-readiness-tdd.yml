name: Distribution Readiness TDD

on:
  pull_request:
    branches:
      - feat/agent-discovery-llms
    paths:
      - 'products/drafts/data-quality-profiler/src/distribution-readiness.mjs'
      - 'products/drafts/data-quality-profiler/scripts/distribution-readiness-check.mjs'
      - 'products/drafts/data-quality-profiler/test/distribution-readiness.test.mjs'
      - '.github/workflows/distribution-readiness-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci
      - name: Distribution readiness tests
        working-directory: products/drafts/data-quality-profiler
        run: node --test test/distribution-readiness.test.mjs
