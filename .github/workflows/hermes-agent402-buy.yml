name: Hermes Agent402 Buyer (safe preparation only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates the live 402; production purchases are disabled in public Actions"
        required: true
        type: choice
        options:
          - dry-run
        default: dry-run
      endpointId:
        description: "Allowlisted Agent402 intelligence endpoint"
        required: true
        type: choice
        options:
          - demand-radar
          - bestsellers
        default: demand-radar
      purchaseId:
        description: "Unique idempotency / ledger ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hermes-agent402-production-spend
  cancel-in-progress: false

jobs:
  buy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci

      - name: Fail closed before any purchase
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" != "dry-run" ]; then
            echo "PUBLIC_ACTIONS_PURCHASE_DISABLED: production purchases are not permitted from public GitHub Actions."
            echo "Run the production buyer locally with HERMES_COMMERCE_SPEND_PRIVATE_KEY set and private results written only to the ignored private-results area."
            exit 1
          fi

      - name: Run bounded Agent402 buyer (dry-run only)
        working-directory: products/drafts/data-quality-profiler
        env:
          MODE: ${{ inputs.mode }}
          ENDPOINT_ID: ${{ inputs.endpointId }}
          PURCHASE_ID: ${{ inputs.purchaseId }}
        run: node scripts/agent402-production-buyer.mjs
