name: Agent402 Route Rank Verify

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query real cross-seller router
        run: |
          node <<'NODE'
          const host = 'hermes-counterparty-api.onrender.com';
          const queries = [
            'Hermes Company Domain Intelligence',
            'company domain intelligence',
            'research company domain',
            'enrich a business domain',
            'qualify a lead company domain',
            'research stripe.com company domain'
          ];
          for (const q of queries) {
            const url = `https://agent402.tools/api/route?q=${encodeURIComponent(q)}&include=external&top=25`;
            const r = await fetch(url, {headers:{'user-agent':'hermes-agent402-route-rank/1.0'}});
            const parsed = await r.json();
            const results = Array.isArray(parsed.results) ? parsed.results : [];
            const rank = results.findIndex(x => String(x.seller ?? '').includes(host) || String(x.url ?? '').includes(host));
            const hit = rank >= 0 ? results[rank] : null;
            console.log(JSON.stringify({q,status:r.status,count:parsed.count ?? results.length,sellers:parsed.sellers ?? null,hermesRank:rank >= 0 ? rank + 1 : null,hermes:hit ? {seller:hit.seller,slug:hit.slug,name:hit.name,route:hit.route,price:hit.price,score:hit.score,health:hit.health,why:hit.why,description:hit.description} : null,top5:results.slice(0,5).map((x,i)=>({rank:i+1,seller:x.seller,name:x.name,route:x.route,price:x.price,score:x.score,health:x.health,why:x.why}))}));
          }
          NODE
