name: External x402 Index Audit

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit Coinbase Bazaar and x402.direct without payment
        run: |
          node <<'NODE'
          const origin = 'hermes-counterparty-api.onrender.com';
          const ua = { 'user-agent': 'hermes-external-index-audit/2.0' };
          const outcomes = [];

          async function auditBazaar() {
            const base = 'https://api.cdp.coinbase.com/platform/v2/x402/discovery/resources';
            const pageSize = 1000;
            let offset = 0;
            let total = null;
            let scanned = 0;
            const matches = [];
            for (let page = 0; page < 200; page++) {
              const r = await fetch(`${base}?limit=${pageSize}&offset=${offset}`, { headers: ua });
              const text = await r.text();
              if (!r.ok) throw new Error(`Bazaar HTTP ${r.status}: ${text.slice(0,300)}`);
              let body;
              try { body = JSON.parse(text); } catch { throw new Error(`Bazaar non-JSON: ${text.slice(0,300)}`); }
              const rows = body?.items || body?.resources || (Array.isArray(body) ? body : []);
              if (!Array.isArray(rows)) throw new Error(`Bazaar unknown shape: ${text.slice(0,500)}`);
              if (!rows.length) break;
              total = body?.pagination?.total ?? total;
              scanned += rows.length;
              for (const row of rows) if (JSON.stringify(row).includes(origin)) matches.push(row);
              offset += rows.length;
              if (total != null && offset >= total) break;
              if (rows.length < pageSize) break;
            }
            return {
              check: 'coinbase-bazaar',
              ok: true,
              total,
              scanned,
              matchCount: matches.length,
              matches: matches.slice(0,20).map(x => ({
                resource: x.resource ?? x.url ?? null,
                serviceName: x.serviceName ?? x.name ?? null,
                network: x.network ?? null,
              })),
            };
          }

          async function auditDirect() {
            let page = 1;
            let scanned = 0;
            const matches = [];
            let declaredTotal = null;
            let declaredPages = null;
            for (; page <= 200; page++) {
              const r = await fetch(`https://x402.direct/api/services?page=${page}&limit=100`, { headers: ua });
              const text = await r.text();
              if (!r.ok) throw new Error(`x402.direct HTTP ${r.status}: ${text.slice(0,300)}`);
              let body;
              try { body = JSON.parse(text); } catch { throw new Error(`x402.direct non-JSON: ${text.slice(0,300)}`); }
              const rows = Array.isArray(body) ? body : (body.services || body.items || body.results || body.data || []);
              if (!Array.isArray(rows)) throw new Error(`x402.direct unknown shape: ${text.slice(0,500)}`);
              declaredTotal = body?.pagination?.total ?? body?.total ?? declaredTotal;
              declaredPages = body?.pagination?.totalPages ?? body?.totalPages ?? body?.pages ?? declaredPages;
              scanned += rows.length;
              for (const row of rows) if (JSON.stringify(row).includes(origin)) matches.push(row);
              if (!rows.length) break;
              if (declaredPages && page >= Number(declaredPages)) break;
              if (declaredTotal && scanned >= Number(declaredTotal)) break;
              if (rows.length < 100) break;
            }
            return {
              check: 'x402-direct',
              ok: true,
              declaredTotal,
              pagesScanned: page,
              scanned,
              matchCount: matches.length,
              matches: matches.slice(0,20),
            };
          }

          for (const fn of [auditBazaar, auditDirect]) {
            try {
              const out = await fn();
              outcomes.push(out);
              console.log(JSON.stringify(out));
            } catch (error) {
              const out = { check: fn.name === 'auditBazaar' ? 'coinbase-bazaar' : 'x402-direct', ok: false, error: String(error?.message || error) };
              outcomes.push(out);
              console.log(JSON.stringify(out));
            }
          }

          if (!outcomes.some(x => x.ok)) throw new Error('Both external indexes were unavailable; audit produced no coverage evidence');
          NODE
