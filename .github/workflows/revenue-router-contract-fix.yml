name: Revenue Router Contract Fix

on:
  push:
    branches:
      - feat/revenue-opportunity-router
    paths:
      - '.github/workflows/revenue-router-contract-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/revenue-opportunity-router
      - name: Fix eight-source contract assumptions
        shell: python
        run: |
          from pathlib import Path

          cli = Path('tools/hermes-commerce-control/test/cli.test.ts')
          text = cli.read_text()
          old = '''        "cdp_bazaar",\n        "trybounty",\n        "paysh",\n        "piprail",\n        "the402",'''
          new = '''        "cdp_bazaar",\n        "paysh",\n        "piprail",\n        "the402",\n        "trybounty",'''
          if old not in text:
              raise SystemExit('CLI expected-source block not found')
          cli.write_text(text.replace(old, new, 1))

          doctor = Path('tools/hermes-commerce-control/test/doctor.test.ts')
          text = doctor.read_text()
          if 'adapterCount = 7' not in text:
              raise SystemExit('doctor default adapter count not found')
          text = text.replace('adapterCount = 7', 'adapterCount = 8', 1)
          text = text.replace('doctorFor(roots.env, 7,', 'doctorFor(roots.env, 8,')
          doctor.write_text(text)
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/revenue-router-contract-fix.yml
          git add tools/hermes-commerce-control/test/cli.test.ts tools/hermes-commerce-control/test/doctor.test.ts
          git commit -m 'fix(revenue): sync eight-source test contracts'
          git push origin HEAD:feat/revenue-opportunity-router
