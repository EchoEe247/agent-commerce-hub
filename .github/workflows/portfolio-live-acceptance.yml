name: Portfolio Live Acceptance

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  distribute-remaining:
    runs-on: ubuntu-latest
    steps:
      - name: Register remaining Batch 1 services with 402 Index
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hermes-counterparty-api.onrender.com'

          register() {
            local path="$1" name="$2" price="$3" probe="$4" description="$5"
            local payload response status
            payload="$(jq -n \
              --arg url "$BASE$path" \
              --arg name "$name" \
              --arg probe "$probe" \
              --arg description "$description" \
              --argjson price "$price" \
              '{url:$url,name:$name,protocol:"x402",http_method:"POST",probe_body:$probe,description:$description,price_usd:$price,payment_asset:"USDC",payment_network:"Base",category:"data-quality",provider:"Hermes Commerce"}')"
            response="/tmp$(echo "$path" | tr '/-' '__').json"
            status="$(curl --max-time 30 -sS -o "$response" -w '%{http_code}' \
              -X POST 'https://402index.io/api/v1/register' \
              -H 'Content-Type: application/json' \
              --data "$payload")"
            echo "$path HTTP=$status"
            cat "$response"; echo
            [ "$status" = '200' ] || [ "$status" = '201' ]
          }

          failures=0
          register '/v1/duplicate-audit' 'Hermes Duplicate Row Audit' '0.005' '{"format":"json","records":[{"id":1},{"id":1}]}' 'Deterministic JSON and CSV duplicate-row audit with unique-row count, duplicate ratio, and repeated row indexes.' || failures=$((failures+1))
          register '/v1/schema-drift' 'Hermes Schema Drift Detector' '0.015' '{"baseline":{"format":"json","records":[{"id":1}]},"current":{"format":"json","records":[{"id":1,"name":"A"}]}}' 'Deterministic schema-drift comparison for added, removed, type-changed, nullable, and breaking changes between datasets.' || failures=$((failures+1))
          register '/v1/data-contract-check' 'Hermes Data Contract Check' '0.015' '{"dataset":{"format":"json","records":[{"id":1}]},"contract":{"required_fields":["id"],"field_types":{"id":"integer"},"allow_extra_fields":true}}' 'JSON and CSV data-contract compatibility check for required fields, expected types, extra fields, and incompatibility reasons.' || failures=$((failures+1))
          register '/v1/clean-normalize' 'Hermes Clean Normalize' '0.02' '{"format":"json","records":[{"id":1,"name":" Alice "},{"id":1,"name":"Alice"}]}' 'Conservative deterministic JSON and CSV cleanup: trim strings, convert blanks to null, and remove exact duplicates without semantic guessing.' || failures=$((failures+1))

          echo "failures=$failures"
          [ "$failures" -eq 0 ]
          echo 'REMAINING_402INDEX_REGISTRATIONS=PASS'
