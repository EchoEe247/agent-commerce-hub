name: Product 11 Codemod

on:
  push:
    branches:
      - feat/sec-company-snapshot
    paths:
      - '.github/workflows/product11-codemod.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sec-company-snapshot
      - name: Wire Product 11 default runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('products/drafts/data-quality-profiler/src/app.mjs')
          s = p.read_text()
          if 'import { createSecCompanySnapshot } from "./sec-company-snapshot.mjs";' not in s:
              s = s.replace('import { createCompanyDomainIntelligence } from "./company-domain-intelligence.mjs";\n', 'import { createCompanyDomainIntelligence } from "./company-domain-intelligence.mjs";\nimport { createSecCompanySnapshot } from "./sec-company-snapshot.mjs";\n', 1)
          if '  secFetch = globalThis.fetch,\n' not in s:
              s = s.replace('  secCompanySnapshot,\n', '  secCompanySnapshot,\n  secFetch = globalThis.fetch,\n  secClock,\n', 1)
          s = s.replace('  const inspectSecCompany = secCompanySnapshot;\n', '  const inspectSecCompany = secCompanySnapshot ?? createSecCompanySnapshot({\n    fetchImpl: secFetch,\n    clock: secClock ?? clock,\n  });\n', 1)
          s = s.replace('      if (typeof inspectSecCompany !== "function") throw new Error("SEC_SOURCE_UNAVAILABLE: SEC snapshot service is not configured");\n', '')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add products/drafts/data-quality-profiler/src/app.mjs
          git commit -m 'feat: wire SEC snapshot default runtime' || true
          git push origin HEAD:feat/sec-company-snapshot
# retrigger-default-runtime
