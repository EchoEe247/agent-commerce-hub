name: Apply Seller Identity Fix

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.head_ref == 'feat/hermes-seller-identity'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes-seller-identity
          fetch-depth: 0
      - name: Apply exact manifest replacements
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('products/drafts/data-quality-profiler/src/app.mjs')
          text = p.read_text()
          replacements = [
            ('name: "Hermes Counterparty Availability",', 'name: "Hermes Agent Commerce API",'),
            ('summary: "Company domain intelligence from public DNS, mail, RDAP, and website signals.",', 'summary: "Company domain intelligence: research and enrich a business domain with public web and infrastructure signals",'),
            ('description: "Returns public DNS A/AAAA records, MX/SPF/DMARC signals, RDAP registration metadata, website reachability and identity metadata, selected social/contact links, and HSTS/CSP presence for a public company domain.",', 'description: "Use this paid operation to research a company, enrich a business, investigate a domain, or qualify a lead after trying the free preview at /v1/company-domain-intelligence/preview. Returns public DNS A/AAAA records, MX/SPF/DMARC signals, RDAP registration metadata, website reachability and identity metadata, selected social/contact links, and HSTS/CSP presence for a public company domain.",'),
          ]
          changed = False
          for old, new in replacements:
            count = text.count(old)
            if count == 1:
              text = text.replace(old, new)
              changed = True
            elif count == 0 and new in text:
              pass
            else:
              raise SystemExit(f'unexpected occurrence count {count} for: {old}')
          if changed:
            p.write_text(text)
          print('changed=' + str(changed).lower())
          PY
      - name: Commit exact change if needed
        run: |
          if git diff --quiet -- products/drafts/data-quality-profiler/src/app.mjs; then
            echo 'No app.mjs change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add products/drafts/data-quality-profiler/src/app.mjs
          git commit -m 'feat: fix portfolio seller identity'
          git push origin HEAD:feat/hermes-seller-identity
