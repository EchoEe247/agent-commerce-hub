name: Robauto Claim Token Static Audit

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract static UI semantics around claim_token
        run: |
          node <<'NODE'
          (async()=>{
            const url='https://robauto.ai/assets/index-BnBc8Sgi.js';
            const r=await fetch(url,{headers:{'user-agent':'hermes-robauto-contract-audit/3.0'}});
            const text=await r.text();
            if(!r.ok) throw new Error(`bundle ${r.status}`);
            const needle='claim_token';
            let from=0,count=0;
            while(true){
              const i=text.indexOf(needle,from); if(i<0)break; count++;
              let snippet=text.slice(Math.max(0,i-2500),Math.min(text.length,i+5000));
              snippet=snippet.replace(/[a-f0-9]{32,}/gi,'<redacted-hex>').replace(/\s+/g,' ');
              console.log(JSON.stringify({check:'claim-token-static-context',occurrence:count,snippet}));
              from=i+needle.length;
              if(count>=5)break;
            }
            console.log(JSON.stringify({check:'claim-token-occurrences',count}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
