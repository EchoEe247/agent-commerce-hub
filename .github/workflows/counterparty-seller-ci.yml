name: Counterparty Seller CI

on:
  push:
    branches:
      - feat/hermes-commerce-control-plane
      - fix/p1-production-change-control-batch-4
    paths:
      - 'products/drafts/data-quality-profiler/**'
      - 'render.yaml'
      - '.github/workflows/counterparty-seller-ci.yml'
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
      - main
    paths:
      - 'products/drafts/data-quality-profiler/**'
      - 'render.yaml'
      - '.github/workflows/counterparty-seller-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seller-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: products/drafts/data-quality-profiler/package-lock.json
      - name: Install dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci
      - name: Full deterministic seller suite
        working-directory: products/drafts/data-quality-profiler
        run: npm test
      - name: Canonical financial snapshots unchanged
        run: |
          git diff --exit-code -- \
            state/commerce-control/ledgers/mainnet-budget-ledger.json \
            state/commerce-control/ledgers/testnet-budget-ledger.json
