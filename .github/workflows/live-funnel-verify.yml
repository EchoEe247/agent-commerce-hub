name: Live Funnel Verify

on:
  push:
    branches:
      - ops/live-funnel-verify-20260824

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live free preview and paid 402 boundary
        env:
          ORIGIN: https://hermes-counterparty-api.onrender.com
        run: |
          node <<'NODE'
          const origin = process.env.ORIGIN;
          const headers = {
            'content-type': 'application/json',
            'user-agent': 'hermes-live-funnel-verifier/1.0'
          };
          const payload = JSON.stringify({ domain: 'stripe.com' });

          const preview = await fetch(`${origin}/v1/company-domain-intelligence/preview`, {
            method: 'POST', headers, body: payload
          });
          const previewBody = await preview.json();
          if (preview.status !== 200) throw new Error(`preview status ${preview.status}`);
          if (preview.headers.get('payment-required')) throw new Error('preview unexpectedly requires payment');
          if (previewBody.preview !== true) throw new Error('preview flag missing');
          if (previewBody.upgrade?.path !== '/v1/company-domain-intelligence') throw new Error('upgrade path mismatch');
          if (Number(previewBody.upgrade?.price_usd) !== 0.02) throw new Error('upgrade price mismatch');
          if (!previewBody.website || typeof previewBody.website.reachable !== 'boolean') throw new Error('preview missing website signals');
          console.log(JSON.stringify({ check: 'preview', status: preview.status, preview: previewBody.preview, upgrade: previewBody.upgrade, reachable: previewBody.website.reachable }));

          const paid = await fetch(`${origin}/v1/company-domain-intelligence`, {
            method: 'POST', headers, body: payload
          });
          if (paid.status !== 402) throw new Error(`paid route status ${paid.status}`);
          const requiredHeader = paid.headers.get('payment-required');
          if (!requiredHeader) throw new Error('paid route missing PAYMENT-REQUIRED');
          const challenge = JSON.parse(Buffer.from(requiredHeader, 'base64').toString('utf8'));
          const quote = challenge.accepts?.[0];
          if (!quote) throw new Error('missing x402 quote');
          if (quote.amount !== '20000') throw new Error(`amount mismatch ${quote.amount}`);
          if (quote.network !== 'eip155:8453') throw new Error(`network mismatch ${quote.network}`);
          console.log(JSON.stringify({ check: 'paid', status: paid.status, amount: quote.amount, network: quote.network, scheme: quote.scheme }));
          NODE
