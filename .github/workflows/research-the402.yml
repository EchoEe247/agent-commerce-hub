name: Research the402 Market

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live catalog and open postings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, collections, statistics

          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':'Hermes-Market-Research/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def items(d, keys):
              if isinstance(d, list): return d
              if isinstance(d, dict):
                  for k in keys:
                      v=d.get(k)
                      if isinstance(v, list): return v
              return []

          catalog_url='https://api.the402.ai/v1/services/catalog?limit=100&offset=0'
          catalog=get(catalog_url)
          services=items(catalog,['services','items','data','results'])
          print('CATALOG_TOP_LEVEL_KEYS=', sorted(catalog.keys()) if isinstance(catalog,dict) else type(catalog).__name__)
          print('CATALOG_RETURNED=', len(services))
          if isinstance(catalog,dict):
              for key in ['total','count','limit','offset']:
                  if key in catalog: print('CATALOG_'+key.upper()+'=',catalog[key])

          by_type=collections.Counter()
          by_category=collections.Counter()
          prices=[]
          for s in services:
              by_type[str(s.get('service_type') or s.get('type') or s.get('fulfillment_type') or 'unknown')]+=1
              by_category[str(s.get('category') or 'uncategorized')]+=1
              p=s.get('price')
              val=None
              if isinstance(p,(int,float)): val=float(p)
              elif isinstance(p,str):
                  try: val=float(p.replace('$','').replace(',',''))
                  except: pass
              elif isinstance(p,dict):
                  for k in ['fixed','price_usd','min']:
                      v=p.get(k)
                      if isinstance(v,(int,float)): val=float(v); break
                      if isinstance(v,str):
                          try: val=float(v.replace('$','').replace(',','')); break
                          except: pass
              if val is None:
                  v=s.get('price_usd')
                  if isinstance(v,(int,float)): val=float(v)
              if val is not None: prices.append(val)

          print('CATALOG_TYPES=',dict(by_type.most_common()))
          print('CATALOG_TOP_CATEGORIES=',by_category.most_common(20))
          if prices:
              sp=sorted(prices)
              print('CATALOG_PRICE_MIN=',sp[0])
              print('CATALOG_PRICE_MEDIAN=',statistics.median(sp))
              print('CATALOG_PRICE_MAX=',sp[-1])

          ranked=sorted(services,key=lambda s:(s.get('provider_completed_jobs') or 0,s.get('provider_reputation') or 0),reverse=True)
          for s in ranked[:25]:
              print('CATALOG_SERVICE',json.dumps({
                  'name':s.get('name'),'service_type':s.get('service_type'),'category':s.get('category'),
                  'price':s.get('price') if s.get('price') is not None else s.get('price_usd'),
                  'provider':s.get('provider_name') or s.get('provider'),'completed_jobs':s.get('provider_completed_jobs'),
                  'reputation':s.get('provider_reputation'),'tags':s.get('tags')
              },sort_keys=True))

          postings_url='https://api.the402.ai/v1/postings?limit=100'
          try:
              postings_raw=get(postings_url)
              postings=items(postings_raw,['postings','requests','items','data','results'])
              print('POSTINGS_TOP_LEVEL_KEYS=',sorted(postings_raw.keys()) if isinstance(postings_raw,dict) else type(postings_raw).__name__)
              print('POSTINGS_RETURNED=',len(postings))
              if isinstance(postings_raw,dict):
                  for key in ['total','count','next_cursor']:
                      if key in postings_raw: print('POSTINGS_'+key.upper()+'=',postings_raw[key])
              for p in postings[:100]:
                  print('POSTING',json.dumps({
                      'id':p.get('id') or p.get('posting_id'),'title':p.get('title'),'category':p.get('category'),
                      'status':p.get('status'),'budget_min':p.get('budget_min_usd') or p.get('min_budget_usd') or p.get('budget_min'),
                      'budget_max':p.get('budget_max_usd') or p.get('max_budget_usd') or p.get('budget_max'),
                      'budget':p.get('budget_usd') or p.get('budget'),'bid_count':p.get('bid_count') or p.get('bids_count'),
                      'created_at':p.get('created_at'),'required_tier':p.get('required_tier')
                  },sort_keys=True))
          except Exception as e:
              print('POSTINGS_FETCH_ERROR=',repr(e))
          PY
