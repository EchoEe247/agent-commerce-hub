name: Hermes x402 External Signer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target Platform (e.g. Agent402)"
        required: true
        default: "Agent402"
      purchaseId:
        description: "Unique Purchase ID for tracking"
        required: true
      endpointId:
        description: "Endpoint to query"
        required: true
        default: "demand-radar"
      expectedMaximumAmount:
        description: "Expected maximum amount (raw atomic USDC)"
        required: true
        default: "20000"
      network:
        description: "Network (testnet only: eip155:84532)"
        required: true
        default: "eip155:84532"

# The tracked JSON ledger is an audit snapshot. Runtime mutation happens in a
# temporary SQLite store and only the validated snapshot is committed after the
# run. Git is no longer the transaction database.
permissions:
  contents: write

concurrency:
  group: x402-signing
  cancel-in-progress: false

jobs:
  sign-and-settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies in profiler
        working-directory: products/drafts/data-quality-profiler
        run: npm ci

      - name: Initialize authoritative testnet financial store from audit snapshot
        working-directory: products/drafts/data-quality-profiler
        run: |
          node scripts/financial-store-admin.mjs init-testnet \
            --db "${{ runner.temp }}/testnet-budget.sqlite"

      - name: Execute Signer & Live Testnet Purchase
        working-directory: products/drafts/data-quality-profiler
        env:
          PLATFORM: ${{ inputs.platform }}
          PURCHASE_ID: ${{ inputs.purchaseId }}
          ENDPOINT_ID: ${{ inputs.endpointId }}
          EXPECTED_MAXIMUM_AMOUNT: ${{ inputs.expectedMaximumAmount }}
          NETWORK: ${{ inputs.network }}
          HERMES_COMMERCE_SPEND_TEST_PRIVATE_KEY: ${{ secrets.HERMES_COMMERCE_SPEND_TEST_PRIVATE_KEY }}
          HERMES_FINANCIAL_DB_PATH: ${{ runner.temp }}/testnet-budget.sqlite
          WORKFLOW_DISPATCH_TIME: ${{ github.event.repository.pushed_at }}
        run: |
          node scripts/github-actions-signer.mjs

      - name: Export validated audit snapshot from authoritative store
        working-directory: products/drafts/data-quality-profiler
        run: |
          node scripts/financial-store-admin.mjs export-testnet \
            --db "${{ runner.temp }}/testnet-budget.sqlite"

      - name: Commit & Push Testnet Audit Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/commerce-control/ledgers/testnet-budget-ledger.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update testnet financial audit snapshot for ${{ inputs.purchaseId }}"
          git push origin HEAD:${{ github.ref_name }}
