name: Post-PR60 Distribution Audit

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
    paths:
      - '.github/workflows/post-pr60-distribution-audit.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://hermes-counterparty-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install seller dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci

      - name: Run live buyer, AgentCash, and 402 Index audits
        id: audit
        shell: bash
        run: |
          set +e

          cd products/drafts/data-quality-profiler
          TARGET_URL="$TARGET_URL" npm run --silent check:buyer-discovery > /tmp/buyer.json 2>/tmp/buyer.err
          BUYER_RC=$?
          cd - >/dev/null

          npx -y @agentcash/discovery@latest discover "$TARGET_URL" > /tmp/agentcash-discover.txt 2>&1
          DISCOVER_RC=$?

          npx -y @agentcash/discovery@latest check "$TARGET_URL/v1/company-domain-intelligence" > /tmp/agentcash-check.txt 2>&1
          CHECK_RC=$?

          node --input-type=module > /tmp/index-readback.txt 2>&1 <<'NODE'
          const origin = 'https://hermes-counterparty-api.onrender.com';
          const registrations = [
            ['5bf29d3e-7409-4813-a94e-43967753e5a7', '/v1/counterparty-availability'],
            ['7b34b76f-8db6-4b82-beb1-046d6a527c39', '/v1/dependency-vulnerability-check'],
            ['eaf50cd6-d37c-4ed5-808b-75ac05e30c50', '/v1/package-maintenance-snapshot'],
            ['e445c809-d5b8-4442-b236-f472c338e6bf', '/v1/duplicate-audit'],
            ['9c9b7851-3e80-432d-9c8b-553e97c0c7f0', '/v1/schema-drift'],
            ['a92878e5-16b3-4e72-9959-12fb7331f8db', '/v1/clean-normalize'],
            ['d534de02-94ef-4a88-ae94-48168c8e42ac', '/v1/repair-plan'],
          ];

          let directFailures = 0;
          for (const [id, path] of registrations) {
            const response = await fetch(`https://402index.io/api/v1/services/${id}`);
            let body = null;
            try { body = await response.json(); } catch {}
            const service = body?.service ?? body;
            const observedUrl = String(service?.url ?? service?.endpoint ?? '');
            const expectedUrl = `${origin}${path}`;
            const ok = response.ok && observedUrl === expectedUrl;
            console.log(`DIRECT_RECORD ${JSON.stringify({id,http_status:response.status,url:observedUrl,status:service?.status ?? null,health_status:service?.health_status ?? null,source:service?.source ?? null,ok})}`);
            if (!ok) directFailures += 1;
          }
          if (directFailures) throw new Error(`Direct registration records failed verification: ${directFailures}`);

          const openapiResponse = await fetch(`${origin}/openapi.json`);
          if (!openapiResponse.ok) throw new Error(`OpenAPI fetch failed: ${openapiResponse.status}`);
          const openapi = await openapiResponse.json();
          const expected = Object.entries(openapi?.paths ?? {})
            .filter(([, item]) => item?.post?.['x-payment-info'])
            .map(([path]) => `${origin}${path}`)
            .sort();

          const company = openapi?.paths?.['/v1/company-domain-intelligence']?.post;
          const preview = openapi?.paths?.['/v1/company-domain-intelligence/preview']?.post;
          if (company?.operationId !== 'companyDomainIntelligenceEnrichment') {
            throw new Error(`Unexpected live company operationId: ${company?.operationId ?? 'missing'}`);
          }
          if (!preview) throw new Error('Live OpenAPI is missing the free company preview');

          const searchUrl = new URL('https://402index.io/api/v1/services');
          searchUrl.searchParams.set('q', 'Hermes Agent Commerce API');
          searchUrl.searchParams.set('protocol', 'x402');
          searchUrl.searchParams.set('limit', '200');
          const response = await fetch(searchUrl);
          if (!response.ok) throw new Error(`402 Index search failed: ${response.status}`);
          const data = await response.json();
          const rows = Array.isArray(data) ? data : (data.services || data.results || data.data || []);
          const originRows = rows.filter((row) => String(row.url || row.endpoint || '').startsWith(origin));
          const observed = [...new Set(originRows.map((row) => String(row.url || row.endpoint || '')))].sort();
          const missing = expected.filter((item) => !observed.includes(item));

          console.log('LIVE_OPENAPI_OVERLAY=PASS');
          console.log('DIRECT_REGISTRATION_RECORDS=7');
          console.log(`SEARCH_EXPECTED_PAID=${expected.length}`);
          console.log(`SEARCH_OBSERVED_UNIQUE_URLS=${observed.length}`);
          console.log(`SEARCH_MISSING=${missing.length}`);
          console.log(`SEARCH_PROPAGATION=${missing.length ? 'INCOMPLETE' : 'COMPLETE'}`);
          for (const item of missing) console.log(`SEARCH_MISSING_URL ${item}`);
          console.log('DIRECT_REGISTRATION_VERIFICATION=PASS');
          NODE
          INDEX_RC=$?

          set -e

          {
            echo "BUYER_RC=$BUYER_RC"
            echo "DISCOVER_RC=$DISCOVER_RC"
            echo "CHECK_RC=$CHECK_RC"
            echo "INDEX_RC=$INDEX_RC"
          } > /tmp/audit-status.env

          cat /tmp/audit-status.env

      - name: Post audit receipt to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          source /tmp/audit-status.env || true
          {
            echo '## Post-PR60 live distribution audit'
            echo
            echo "- Buyer-discovery remote exit: ${BUYER_RC:-missing}"
            echo "- AgentCash origin discovery exit: ${DISCOVER_RC:-missing}"
            echo "- AgentCash paid-endpoint check exit: ${CHECK_RC:-missing}"
            echo "- 402 Index readback exit: ${INDEX_RC:-missing}"
            echo
            echo '### Buyer discovery'
            echo '```json'
            head -c 12000 /tmp/buyer.json 2>/dev/null || true
            echo
            echo '```'
            if [ -s /tmp/buyer.err ]; then
              echo 'Buyer stderr:'
              echo '```text'
              head -c 4000 /tmp/buyer.err
              echo
              echo '```'
            fi
            echo
            echo '### AgentCash discover'
            echo '```text'
            head -c 12000 /tmp/agentcash-discover.txt 2>/dev/null || true
            echo
            echo '```'
            echo
            echo '### AgentCash paid endpoint check'
            echo '```text'
            head -c 8000 /tmp/agentcash-check.txt 2>/dev/null || true
            echo
            echo '```'
            echo
            echo '### 402 Index readback'
            echo '```text'
            cat /tmp/index-readback.txt 2>/dev/null || true
            echo '```'
            echo
            echo 'No registration, payment, signer, settlement, price, wallet, or production-code mutation was performed by this audit.'
          } > /tmp/audit-comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/audit-comment.md

      - name: Enforce critical live gates
        if: always()
        shell: bash
        run: |
          source /tmp/audit-status.env
          if [ "$BUYER_RC" -ne 0 ] || [ "$DISCOVER_RC" -ne 0 ] || [ "$CHECK_RC" -ne 0 ] || [ "$INDEX_RC" -ne 0 ]; then
            echo "One or more critical live distribution gates failed."
            exit 1
          fi
          echo "POST_PR60_DISTRIBUTION_AUDIT=PASS"
