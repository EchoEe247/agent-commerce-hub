name: MiniA2A Free Listing Probe

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish one flagship Hermes endpoint if absent
        run: |
          node <<'NODE'
          (async()=>{
            const base='https://minia2a.uk';
            const origin='https://hermes-counterparty-api.onrender.com';
            const endpoint=`${origin}/v1/company-domain-intelligence`;
            const ua={'user-agent':'hermes-minia2a-listing-probe/1.0'};
            async function req(url,options={}){
              const r=await fetch(url,{...options,headers:{...ua,...(options.headers||{})}});
              const text=await r.text();
              let body=null; try{body=JSON.parse(text)}catch{}
              return {r,text,body};
            }
            function rowsOf(body){
              if(Array.isArray(body))return body;
              for(const k of ['services','items','results','data'])if(Array.isArray(body?.[k]))return body[k];
              return [];
            }
            let found=[];
            for(const q of ['Hermes Agent Commerce API','hermes-counterparty-api.onrender.com','company domain intelligence']){
              const out=await req(`${base}/api/services?q=${encodeURIComponent(q)}`);
              if(!out.r.ok)throw new Error(`catalog search ${out.r.status}: ${out.text.slice(0,300)}`);
              found.push(...rowsOf(out.body).filter(x=>JSON.stringify(x).includes('hermes-counterparty-api.onrender.com')));
            }
            const uniq=[...new Map(found.map(x=>[x.id||x.url||JSON.stringify(x),x])).values()];
            if(!uniq.length){
              const manifest=await req(`${origin}/.well-known/x402`);
              if(!manifest.r.ok)throw new Error(`Hermes manifest ${manifest.r.status}`);
              const live=manifest.body?.endpoints?.find(x=>x.path==='/v1/company-domain-intelligence');
              if(!live)throw new Error('Hermes manifest missing company-domain-intelligence');
              const payload={
                url:endpoint,
                name:'Hermes Company & Domain Intelligence',
                description:'Research and enrich a business domain with public DNS, mail security, RDAP registration, website identity, social/contact links, and security-header signals. x402 USDC on Base.',
                price:Number(live.price_usd),
                categories:['data','business-intelligence','x402'],
                method:'POST'
              };
              const out=await req(`${base}/api/v1/services`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
              const safe={status:out.r.status,ok:out.r.ok};
              if(out.body&&typeof out.body==='object'){
                for(const k of ['id','service_id','name','url','message','error','success'])if(k in out.body)safe[k]=out.body[k];
              }
              console.log(JSON.stringify({check:'publish-response',...safe}));
              if(!out.r.ok)throw new Error(`publish failed ${out.r.status}: ${String(out.body?.error||out.body?.message||out.text.slice(0,300))}`);
            }
            const verify=await req(`${base}/api/services?q=${encodeURIComponent('hermes-counterparty-api.onrender.com')}`);
            if(!verify.r.ok)throw new Error(`verify search ${verify.r.status}`);
            const hits=rowsOf(verify.body).filter(x=>JSON.stringify(x).includes('hermes-counterparty-api.onrender.com'));
            if(!hits.length)throw new Error('Hermes listing not visible after publish/search');
            console.log(JSON.stringify({check:'minia2a-listing',verified:true,count:hits.length,hits:hits.slice(0,10).map(x=>({id:x.id??null,name:x.name??x.title??null,url:x.url??x.endpoint??null,price:x.price??x.price_cents??null,method:x.method??null,category:x.category??x.categories??null}))}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
