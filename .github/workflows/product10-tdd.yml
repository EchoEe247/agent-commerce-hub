name: Product 10 Final Verification

on:
  push:
    branches:
      - feat/company-domain-intelligence
    paths:
      - '.github/workflows/product10-tdd.yml'
      - 'products/drafts/data-quality-profiler/**'

permissions:
  contents: write

jobs:
  product10-final-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci
      - name: Run syntax and full-suite verification and persist receipt
        shell: bash
        run: |
          set -uo pipefail
          cd products/drafts/data-quality-profiler
          set +e
          {
            node --check src/company-domain-intelligence.mjs &&
            node --check src/app.mjs &&
            node --check src/openapi.mjs &&
            node --check src/config.mjs &&
            node --check src/errors.mjs &&
            node --check src/payments/x402-plugin.mjs &&
            npm test
          } > /tmp/product10-final.log 2>&1
          code=$?
          set -e
          TEST_EXIT_CODE="$code" node <<'NODE'
          const fs = require('node:fs');
          const code = Number(process.env.TEST_EXIT_CODE);
          const output = fs.readFileSync('/tmp/product10-final.log', 'utf8');
          const receipt = {
            observed_at: new Date().toISOString(),
            status: code === 0 ? 'PASS' : 'FAIL',
            exit_code: code,
            verification: 'syntax + npm test',
            output_tail: output.split('\n').slice(-240).join('\n'),
          };
          fs.writeFileSync('../../../product10-final-verification.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          cd ../../..
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add product10-final-verification.json
          git commit -m "test: record Product 10 final verification" || true
          git push origin HEAD:feat/company-domain-intelligence
          exit "$code"
