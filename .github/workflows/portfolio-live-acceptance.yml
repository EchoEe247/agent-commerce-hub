name: Portfolio Live Acceptance

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Agent402 recrawl and verify directories
        shell: bash
        run: |
          set -euo pipefail

          ORIGIN='https://hermes-counterparty-api.onrender.com'
          SELLER_URL='https://agent402.tools/api/index?seller=hermes-counterparty-api.onrender.com'
          DEPLOY_MS='1787276499000'
          EXPECTED_ROUTES='["/v1/clean-normalize","/v1/counterparty-availability","/v1/data-contract-check","/v1/duplicate-audit","/v1/profile","/v1/quality-gate","/v1/repair-plan","/v1/schema-drift"]'

          echo '=== AGENT402 RECrawl ==='
          passed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl --max-time 30 -sS -o /tmp/agent402.json -w '%{http_code}' "$SELLER_URL")"
            echo "attempt=$attempt HTTP=$status"
            if [ "$status" = '200' ]; then
              jq '{toolCount,fetchedAt,error,health,routable,tools:[.tools[]|{method,route,name,price,networks}]}' /tmp/agent402.json
              if jq -e --argjson deploy "$DEPLOY_MS" --argjson routes "$EXPECTED_ROUTES" '
                .error == null and
                .health == 1 and
                .routable == true and
                .fetchedAt > $deploy and
                .toolCount == 8 and
                (.tools | length) == 8 and
                ([.tools[].method] | all(. == "POST")) and
                (([.tools[].route] | sort) == $routes)
              ' /tmp/agent402.json >/dev/null; then
                passed=1
                break
              fi
            fi
            if [ "$attempt" -lt 8 ]; then sleep 60; fi
          done
          [ "$passed" -eq 1 ]
          echo 'AGENT402_8_POST_TOOLS=PASS'

          echo '=== 402 INDEX DIRECTORY ==='
          status="$(curl --max-time 30 -sS -o /tmp/402index.json -w '%{http_code}' \
            'https://402index.io/api/v1/services?q=Hermes&protocol=x402&limit=100')"
          echo "HTTP=$status"
          [ "$status" = '200' ]
          jq '{total, services:[.services[] | select(.url | startswith("https://hermes-counterparty-api.onrender.com/")) | {name,url,http_method,price_usd,health_status,status,domain_verified,x402_payment_valid}]}' /tmp/402index.json

          EXPECTED_NEW='["/v1/clean-normalize","/v1/data-contract-check","/v1/duplicate-audit","/v1/quality-gate","/v1/repair-plan","/v1/schema-drift"]'
          jq -e --arg origin "$ORIGIN" --argjson expected "$EXPECTED_NEW" '
            ([.services[]
              | select(.url | startswith($origin + "/"))
              | select(.http_method == "POST")
              | .url
              | sub("^https://hermes-counterparty-api\\.onrender\\.com"; "")
            ] | unique | sort) as $actual
            | ($expected - $actual | length) == 0
          ' /tmp/402index.json >/dev/null
          echo '402INDEX_BATCH1_LISTINGS=PASS'

          echo 'DISCOVERY_ACCEPTANCE=PASS'
