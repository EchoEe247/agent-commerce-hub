name: Product 12 OSV Green

on:
  push:
    branches:
      - feat/product12-dependency-vulnerability
    paths:
      - '.github/workflows/product12-osv-green.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product12-dependency-vulnerability
      - name: Wire Product 12 default OSV service
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('products/drafts/data-quality-profiler/src/app.mjs')
          s = p.read_text()
          old = 'import { createSecCompanySnapshot } from "./sec-company-snapshot.mjs";\n'
          new = old + 'import { createDependencyVulnerabilityCheck } from "./dependency-vulnerability-check.mjs";\n'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '  dependencyVulnerabilityCheck,\n  secFetch = globalThis.fetch,'
          new = '  dependencyVulnerabilityCheck,\n  osvFetch = globalThis.fetch,\n  osvClock,\n  secFetch = globalThis.fetch,'
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '  const inspectDependency = dependencyVulnerabilityCheck;\n'
          new = '''  const inspectDependency = dependencyVulnerabilityCheck ?? createDependencyVulnerabilityCheck({\n    fetchImpl: osvFetch,\n    clock: osvClock ?? clock,\n  });\n'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- products/drafts/data-quality-profiler/src/app.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/drafts/data-quality-profiler/src/app.mjs
          git commit -m "feat: wire Product 12 default OSV runtime"
          git push origin HEAD:feat/product12-dependency-vulnerability
