name: Portfolio Batch 1 CI

on:
  push:
    branches:
      - feat/portfolio-batch-1
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        working-directory: products/drafts/data-quality-profiler
        run: npm ci
      - name: Full test suite
        working-directory: products/drafts/data-quality-profiler
        run: node --test test/*.test.mjs
      - name: Syntax checks
        working-directory: products/drafts/data-quality-profiler
        run: |
          node --check src/app.mjs
          node --check src/config.mjs
          node --check src/payments/x402-plugin.mjs
          if [ -f src/dataset/operations.mjs ]; then node --check src/dataset/operations.mjs; fi
