name: Hermes Agent402 Production Buyer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run validates the live 402; execute signs and pays"
        required: true
        type: choice
        options:
          - dry-run
          - execute
        default: dry-run
      endpointId:
        description: "Allowlisted Agent402 intelligence endpoint"
        required: true
        type: choice
        options:
          - demand-radar
          - bestsellers
        default: demand-radar
      purchaseId:
        description: "Unique idempotency / ledger ID"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hermes-agent402-production-spend
  cancel-in-progress: false

jobs:
  buy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci || npm install

      - name: Run bounded Agent402 buyer
        working-directory: products/drafts/data-quality-profiler
        env:
          MODE: ${{ inputs.mode }}
          ENDPOINT_ID: ${{ inputs.endpointId }}
          PURCHASE_ID: ${{ inputs.purchaseId }}
          HERMES_COMMERCE_SPEND_PRIVATE_KEY: ${{ secrets.HERMES_COMMERCE_SPEND_PRIVATE_KEY }}
        run: node scripts/agent402-production-buyer.mjs

      - name: Upload private purchased result
        if: ${{ success() && inputs.mode == 'execute' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent402-result-${{ inputs.purchaseId }}
          path: state/commerce-control/private-results/${{ inputs.purchaseId }}.json
          retention-days: 1
          if-no-files-found: error

      - name: Persist production budget ledger
        if: ${{ always() && inputs.mode == 'execute' }}
        run: |
          if [ -f state/commerce-control/budget-ledger.json ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add state/commerce-control/budget-ledger.json
            git diff --staged --quiet || git commit -m "chore: update Agent402 budget ledger for ${{ inputs.purchaseId }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
