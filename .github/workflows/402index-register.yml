name: 402 Index Hermes Registration

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Register ten live Hermes x402 endpoints
        run: |
          node <<'NODE'
          (async()=>{
            const origin='https://hermes-counterparty-api.onrender.com';
            const registry='https://402index.io/api/v1';
            const provider='Hermes Agent Commerce API';
            const selected=[
              ['/v1/company-domain-intelligence','business-intelligence/company-domain'],
              ['/v1/entity-sanctions-screen','compliance/sanctions'],
              ['/v1/sec-company-snapshot','business-intelligence/public-markets'],
              ['/v1/dependency-vulnerability-check','software-security/vulnerabilities'],
              ['/v1/package-maintenance-snapshot','developer-intelligence/packages'],
              ['/v1/profile','data-quality/profiling'],
              ['/v1/duplicate-audit','data-quality/duplicates'],
              ['/v1/quality-gate','data-quality/validation'],
              ['/v1/schema-drift','data-quality/schema'],
              ['/v1/clean-normalize','data-quality/cleaning']
            ];
            const fallbackExamples={
              '/v1/company-domain-intelligence':{domain:'stripe.com'},
              '/v1/entity-sanctions-screen':{name:'ACME SHIPPING LLC'},
              '/v1/sec-company-snapshot':{ticker:'AAPL'},
              '/v1/dependency-vulnerability-check':{ecosystem:'npm',package:'fastify',version:'5.6.0'},
              '/v1/package-maintenance-snapshot':{ecosystem:'npm',package:'fastify',version:'5.6.0'},
              '/v1/profile':{format:'json',records:[{id:1,name:'Alice'},{id:1,name:'Alice'}]},
              '/v1/duplicate-audit':{format:'json',records:[{id:1,name:'Alice'},{id:1,name:'Alice'}]},
              '/v1/quality-gate':{format:'json',records:[{id:1,name:'Alice'},{id:2,name:null}]},
              '/v1/schema-drift':{format:'json',records:[{id:1,name:'Alice'},{id:2,name:'Bob'}]},
              '/v1/clean-normalize':{format:'json',records:[{id:1,name:' Alice '},{id:1,name:'Alice'}]}
            };
            const ua={'user-agent':'hermes-402index-registration/1.0'};
            async function call(url,options={}){
              const r=await fetch(url,{...options,headers:{...ua,...(options.headers||{})}});
              const text=await r.text();
              let body=null; try{body=JSON.parse(text)}catch{}
              return {r,text,body};
            }
            function opExample(op,path){
              const content=op?.requestBody?.content?.['application/json'];
              if(content?.example && typeof content.example==='object') return content.example;
              if(content?.examples && typeof content.examples==='object'){
                for(const v of Object.values(content.examples)){
                  if(v?.value && typeof v.value==='object') return v.value;
                }
              }
              return fallbackExamples[path];
            }
            const [manifestOut,openapiOut]=await Promise.all([
              call(`${origin}/.well-known/x402`),call(`${origin}/openapi.json`)
            ]);
            if(!manifestOut.r.ok)throw new Error(`live manifest ${manifestOut.r.status}`);
            if(!openapiOut.r.ok)throw new Error(`live OpenAPI ${openapiOut.r.status}`);
            const manifest=manifestOut.body;
            const spec=openapiOut.body;
            if(manifest?.name!==provider)throw new Error(`unexpected live seller name ${manifest?.name}`);
            if(!Array.isArray(manifest?.endpoints)||manifest.endpoints.length!==13)throw new Error(`unexpected endpoint count ${manifest?.endpoints?.length}`);

            // Read-only discovery check. This does not determine whether we submit:
            // POST /register is documented as idempotent for an existing URL+protocol.
            const prior=await call(`${registry}/services?q=${encodeURIComponent('Hermes Agent Commerce API')}&protocol=x402&limit=200`);
            const priorRows=prior.r.ok?(prior.body?.services||[]):[];
            const priorHits=priorRows.filter(x=>String(x.url||'').includes('hermes-counterparty-api.onrender.com'));
            console.log(JSON.stringify({check:'prior-402index-search',status:prior.r.status,hermesHits:priorHits.length,ids:priorHits.map(x=>x.id).slice(0,20)}));

            const accepted=[];
            const failures=[];
            for(const [path,category] of selected){
              const live=manifest.endpoints.find(x=>x.path===path);
              if(!live)throw new Error(`manifest missing ${path}`);
              const op=spec?.paths?.[path]?.post;
              const example=opExample(op,path);
              if(!example||typeof example!=='object')throw new Error(`no valid probe example for ${path}`);
              const name=(live.name && String(live.name).trim()) || op?.summary || `Hermes ${path.split('/').pop()}`;
              const description=(live.summary && String(live.summary).trim()) || op?.summary || `Hermes paid x402 endpoint ${path}`;
              const payload={
                url:`${origin}${path}`,
                name,
                protocol:'x402',
                http_method:'POST',
                probe_body:JSON.stringify(example),
                description,
                price_usd:Number(live.price_usd),
                payment_asset:'USDC',
                payment_network:'Base',
                category,
                provider
              };
              const out=await call(`${registry}/register`,{
                method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)
              });
              const b=out.body||{};
              const record=b.service||b.data||b;
              const safe={
                path,status:out.r.status,ok:out.r.ok,
                id:record?.id??null,
                recordStatus:record?.status??b.status??null,
                protocol:record?.protocol??null,
                url:record?.url??payload.url,
                probeHttpStatus:b?.probe?.httpStatus??b?.verification?.httpStatus??null,
                detectedProtocols:b?.probe?.detectedProtocols??null,
                suggestedProtocol:b?.suggestedProtocol??null,
                error:b?.error??b?.message??null
              };
              console.log(JSON.stringify({check:'register',...safe}));
              if(out.r.status===201 || (out.r.ok && record?.id!=null)) accepted.push(safe);
              else failures.push(safe);
            }
            if(failures.length)throw new Error(`402 Index registration failures: ${JSON.stringify(failures)}`);
            if(accepted.length!==selected.length)throw new Error(`accepted ${accepted.length}/${selected.length}`);
            console.log(JSON.stringify({check:'402index-batch',verified:true,accepted:accepted.length,ids:accepted.map(x=>x.id),paths:accepted.map(x=>x.path)}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
