name: Counterparty Seller CI

on:
  push:
    branches:
      - feat/hermes-commerce-control-plane
      - feat/entity-sanctions-screen
      - feat/company-domain-intelligence
      - feat/sec-company-snapshot
    paths:
      - 'products/drafts/data-quality-profiler/src/counterparty-availability.mjs'
      - 'products/drafts/data-quality-profiler/src/entity-sanctions-screen.mjs'
      - 'products/drafts/data-quality-profiler/src/company-domain-intelligence.mjs'
      - 'products/drafts/data-quality-profiler/src/sec-company-snapshot.mjs'
      - 'products/drafts/data-quality-profiler/src/app.mjs'
      - 'products/drafts/data-quality-profiler/src/openapi.mjs'
      - 'products/drafts/data-quality-profiler/src/config.mjs'
      - 'products/drafts/data-quality-profiler/src/errors.mjs'
      - 'products/drafts/data-quality-profiler/src/payments/x402-plugin.mjs'
      - 'products/drafts/data-quality-profiler/scripts/ofac-source-smoke.mjs'
      - 'products/drafts/data-quality-profiler/test/counterparty-availability.test.mjs'
      - 'products/drafts/data-quality-profiler/test/entity-sanctions-screen.test.mjs'
      - 'products/drafts/data-quality-profiler/test/entity-sanctions-source.test.mjs'
      - 'products/drafts/data-quality-profiler/test/entity-sanctions-x402.test.mjs'
      - 'products/drafts/data-quality-profiler/test/company-domain-intelligence.test.mjs'
      - 'products/drafts/data-quality-profiler/test/sec-company-snapshot.test.mjs'
      - 'products/drafts/data-quality-profiler/test/sec-company-snapshot-x402.test.mjs'
      - 'products/drafts/data-quality-profiler/test/counterparty-api.test.mjs'
      - 'products/drafts/data-quality-profiler/test/openapi-discovery.test.mjs'
      - 'products/drafts/data-quality-profiler/test/x402-plugin.test.mjs'
      - 'products/drafts/data-quality-profiler/test/config.test.mjs'
      - '.github/workflows/counterparty-seller-ci.yml'
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
    paths:
      - 'products/drafts/data-quality-profiler/src/counterparty-availability.mjs'
      - 'products/drafts/data-quality-profiler/src/entity-sanctions-screen.mjs'
      - 'products/drafts/data-quality-profiler/src/company-domain-intelligence.mjs'
      - 'products/drafts/data-quality-profiler/src/sec-company-snapshot.mjs'
      - 'products/drafts/data-quality-profiler/src/app.mjs'
      - 'products/drafts/data-quality-profiler/src/openapi.mjs'
      - 'products/drafts/data-quality-profiler/src/config.mjs'
      - 'products/drafts/data-quality-profiler/src/errors.mjs'
      - 'products/drafts/data-quality-profiler/src/payments/x402-plugin.mjs'
      - 'products/drafts/data-quality-profiler/scripts/ofac-source-smoke.mjs'
      - 'products/drafts/data-quality-profiler/test/counterparty-availability.test.mjs'
      - 'products/drafts/data-quality-profiler/test/entity-sanctions-screen.test.mjs'
      - 'products/drafts/data-quality-profiler/test/entity-sanctions-source.test.mjs'
      - 'products/drafts/data-quality-profiler/test/entity-sanctions-x402.test.mjs'
      - 'products/drafts/data-quality-profiler/test/company-domain-intelligence.test.mjs'
      - 'products/drafts/data-quality-profiler/test/sec-company-snapshot.test.mjs'
      - 'products/drafts/data-quality-profiler/test/sec-company-snapshot-x402.test.mjs'
      - 'products/drafts/data-quality-profiler/test/counterparty-api.test.mjs'
      - 'products/drafts/data-quality-profiler/test/openapi-discovery.test.mjs'
      - 'products/drafts/data-quality-profiler/test/x402-plugin.test.mjs'
      - 'products/drafts/data-quality-profiler/test/config.test.mjs'
      - '.github/workflows/counterparty-seller-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: products/drafts/data-quality-profiler
        run: npm ci
      - name: Syntax check changed runtime
        working-directory: products/drafts/data-quality-profiler
        run: |
          node --check src/counterparty-availability.mjs
          if [ -f src/entity-sanctions-screen.mjs ]; then node --check src/entity-sanctions-screen.mjs; fi
          if [ -f src/company-domain-intelligence.mjs ]; then node --check src/company-domain-intelligence.mjs; fi
          if [ -f src/sec-company-snapshot.mjs ]; then node --check src/sec-company-snapshot.mjs; fi
          if [ -f scripts/ofac-source-smoke.mjs ]; then node --check scripts/ofac-source-smoke.mjs; fi
          node --check src/app.mjs
          node --check src/openapi.mjs
          node --check src/config.mjs
          node --check src/payments/x402-plugin.mjs
      - name: Focused seller tests
        working-directory: products/drafts/data-quality-profiler
        run: |
          TESTS=(test/counterparty-availability.test.mjs test/counterparty-api.test.mjs test/openapi-discovery.test.mjs test/x402-plugin.test.mjs test/config.test.mjs)
          if [ -f test/entity-sanctions-screen.test.mjs ]; then TESTS+=(test/entity-sanctions-screen.test.mjs); fi
          if [ -f test/entity-sanctions-source.test.mjs ]; then TESTS+=(test/entity-sanctions-source.test.mjs); fi
          if [ -f test/entity-sanctions-x402.test.mjs ]; then TESTS+=(test/entity-sanctions-x402.test.mjs); fi
          if [ -f test/company-domain-intelligence.test.mjs ]; then TESTS+=(test/company-domain-intelligence.test.mjs); fi
          if [ -f test/sec-company-snapshot.test.mjs ]; then TESTS+=(test/sec-company-snapshot.test.mjs); fi
          if [ -f test/sec-company-snapshot-x402.test.mjs ]; then TESTS+=(test/sec-company-snapshot-x402.test.mjs); fi
          node --test "${TESTS[@]}"
      - name: Full profiler suite (PR gate)
        if: github.event_name == 'pull_request'
        working-directory: products/drafts/data-quality-profiler
        run: npm test
      - name: Live OFAC source smoke (PR gate)
        if: github.event_name == 'pull_request'
        working-directory: products/drafts/data-quality-profiler
        run: node scripts/ofac-source-smoke.mjs
