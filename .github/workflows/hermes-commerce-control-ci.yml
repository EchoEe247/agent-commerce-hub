name: Hermes Commerce Control CI

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane
    paths:
      - 'tools/hermes-commerce-control/**'
      - '.github/workflows/hermes-commerce-control-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/hermes-commerce-control/package-lock.json
      - name: Install dependencies
        working-directory: tools/hermes-commerce-control
        run: npm ci
      - name: Typecheck
        working-directory: tools/hermes-commerce-control
        run: npm run typecheck
      - name: Test
        working-directory: tools/hermes-commerce-control
        run: npm test
