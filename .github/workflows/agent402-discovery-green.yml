name: Agent402 Discovery Green

on:
  push:
    branches:
      - feat/agent402-discovery-ranking
    paths:
      - '.github/workflows/agent402-discovery-green.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent402-discovery-ranking
      - name: Apply minimal discovery metadata changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('products/drafts/data-quality-profiler/src/openapi.mjs')
          s = p.read_text()
          replacements = {
              'summary: "Screen an entity or person against OFAC SDN",': 'summary: "OFAC sanctions screening for a person or organization",',
              'summary: "SEC EDGAR company identity, filings, and XBRL snapshot",': 'summary: "SEC company snapshot by ticker or CIK with filings and financial facts",',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- products/drafts/data-quality-profiler/src/openapi.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/drafts/data-quality-profiler/src/openapi.mjs
          git commit -m "fix: improve marketplace discovery wording"
          git push origin HEAD:feat/agent402-discovery-ranking
