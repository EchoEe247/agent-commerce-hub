name: HCC Portable Package Diagnostic

on:
  push:
    branches:
      - diagnostic/hcc-audit-20260902

permissions:
  contents: read

jobs:
  portable-package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/hermes-commerce-control
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/hermes-commerce-control/package-lock.json
      - name: Install exact patched lock tree
        run: npm ci
      - name: Build typecheck and contracts
        run: |
          npm run build
          npm run typecheck
          npm run test:contracts
      - name: Verify built hardened launchers
        run: |
          test -f dist/launch/cli.js
          test -f dist/launch/mcp.js
          test "$(head -1 dist/launch/cli.js)" = '#!/usr/bin/env node'
          test "$(head -1 dist/launch/mcp.js)" = '#!/usr/bin/env node'
          echo 'BUILT_LAUNCHERS=PASS'
      - name: Prove canary scrub and hostile gate normalization
        shell: bash
        run: |
          set +e
          PIPRAIL_PRIVATE_KEY=canary-not-a-real-key node dist/cli.js doctor --json > "$RUNNER_TEMP/direct-doctor.json"
          direct_status=$?
          set -e
          PIPRAIL_PRIVATE_KEY=canary-not-a-real-key node dist/launch/cli.js doctor --json > "$RUNNER_TEMP/hardened-doctor.json"
          COMMERCE_MODE=B EXTERNAL_WRITES_ENABLED=true LIVE_VALUE_MOVEMENT_ENABLED=true \
            node dist/launch/cli.js doctor --json > "$RUNNER_TEMP/hostile-doctor.json"
          node <<'NODE'
          const fs = require('node:fs');
          const direct = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/direct-doctor.json', 'utf8'));
          const hard = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/hardened-doctor.json', 'utf8'));
          const hostile = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/hostile-doctor.json', 'utf8'));
          if (direct.data?.walletSecretPresent !== true) throw new Error('direct implementation did not detect canary');
          if (hard.data?.walletSecretPresent !== false) throw new Error('hardened launcher retained canary');
          if ((hard.data?.walletSecretEnvNames ?? []).length !== 0) throw new Error('hardened launcher reported wallet env names');
          if (hostile.data?.mode !== 'A') throw new Error('hostile mode escaped Mode A');
          if (hostile.data?.externalWritesEnabled !== false) throw new Error('external writes escaped false');
          if (hostile.data?.liveValueMovementEnabled !== false) throw new Error('live value movement escaped false');
          if (hostile.data?.walletSecretPresent !== false) throw new Error('hostile doctor sees wallet secret');
          console.log('CANARY_AND_MODE_A=PASS');
          NODE
          echo "DIRECT_DOCTOR_EXIT=$direct_status"
      - name: Prove portable workspace selection
        shell: bash
        run: |
          HCC_ROOT="$PWD"
          CWD_WORKSPACE="$(mktemp -d)"
          EXPLICIT_WORKSPACE="$(mktemp -d)"
          (
            cd "$CWD_WORKSPACE"
            node "$HCC_ROOT/dist/launch/cli.js" doctor --json
          ) > "$RUNNER_TEMP/cwd-doctor.json"
          COMMERCE_REPO_ROOT="$EXPLICIT_WORKSPACE" node dist/launch/cli.js doctor --json > "$RUNNER_TEMP/explicit-doctor.json"
          CWD_WORKSPACE="$CWD_WORKSPACE" EXPLICIT_WORKSPACE="$EXPLICIT_WORKSPACE" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const cwd = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cwd-doctor.json', 'utf8'));
          const explicit = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/explicit-doctor.json', 'utf8'));
          if (path.resolve(cwd.data?.paths?.repoRoot ?? '') !== path.resolve(process.env.CWD_WORKSPACE)) throw new Error(`CWD repoRoot mismatch: ${cwd.data?.paths?.repoRoot}`);
          if (path.resolve(explicit.data?.paths?.repoRoot ?? '') !== path.resolve(process.env.EXPLICIT_WORKSPACE)) throw new Error(`explicit repoRoot mismatch: ${explicit.data?.paths?.repoRoot}`);
          console.log('WORKSPACE_SELECTION=PASS');
          NODE
      - name: Validate npm pack and installed CLI bin
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack-dry-run.json"
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/pack-dry-run.json', 'utf8'));
          const files = new Set((report[0]?.files ?? []).map(x => x.path));
          for (const required of ['dist/launch/cli.js', 'dist/launch/mcp.js', 'package.json', 'README.md']) {
            if (!files.has(required)) throw new Error(`pack missing ${required}`);
          }
          console.log(`PACK_FILE_COUNT=${files.size}`);
          NODE
          PKG_TGZ="$(npm pack --silent)"
          TMP_PREFIX="$(mktemp -d)"
          npm install --prefix "$TMP_PREFIX" "$PWD/$PKG_TGZ" --ignore-scripts
          test -x "$TMP_PREFIX/node_modules/.bin/commerce"
          test -x "$TMP_PREFIX/node_modules/.bin/commerce-mcp"
          "$TMP_PREFIX/node_modules/.bin/commerce" doctor --json > "$RUNNER_TEMP/installed-bin-doctor.json"
          node <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/installed-bin-doctor.json', 'utf8'));
          if (d.data?.mode !== 'A' || d.data?.walletSecretPresent !== false) throw new Error('installed commerce bin is not hardened');
          console.log('LOCAL_BIN_INSTALL=PASS');
          NODE
          rm -f "$PKG_TGZ"
      - name: Verify hardened MCP stdio handshake
        shell: bash
        run: |
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"portable-ci","version":"1.0.0"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          } | PIPRAIL_PRIVATE_KEY=canary-not-a-real-key node dist/launch/mcp.js > "$RUNNER_TEMP/mcp.out" 2> "$RUNNER_TEMP/mcp.err"
          if grep -Fq 'canary-not-a-real-key' "$RUNNER_TEMP/mcp.err"; then
            echo 'secret canary leaked to stderr' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            'commerce_discover_services','commerce_discover_work','commerce_export_evidence',
            'commerce_inspect','commerce_prepare_claim','commerce_prepare_publish',
            'commerce_prepare_purchase','commerce_probe','commerce_quote','commerce_sources','commerce_status'
          ].sort();
          const forbidden = [
            'commerce_pay','commerce_purchase','commerce_claim','commerce_submit','commerce_settle',
            'commerce_transfer','commerce_withdraw','commerce_fund','commerce_publish',
            'piprail_pay_request','pay','purchase','claim','submit','settle','transfer','withdraw','publish'
          ];
          const text = fs.readFileSync(process.env.RUNNER_TEMP + '/mcp.out', 'utf8');
          const lines = text.split('\n').filter(x => x.trim());
          const msgs = lines.map(line => JSON.parse(line));
          if (msgs.some(m => m.jsonrpc !== '2.0')) throw new Error('non-protocol stdout');
          if (!msgs.find(m => m.id === 1)?.result) throw new Error('initialize response missing');
          const listed = msgs.find(m => m.id === 2);
          const names = (listed?.result?.tools ?? []).map(t => t.name).sort();
          if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error(`tool mismatch: ${names.join(',')}`);
          const exposed = forbidden.filter(name => names.includes(name));
          if (exposed.length) throw new Error(`live-action tools exposed: ${exposed.join(',')}`);
          console.log(`MCP_TOOL_COUNT=${names.length}`);
          console.log('MCP_HANDSHAKE=PASS');
          NODE
      - name: Verify isolated installer compatibility
        shell: bash
        run: |
          TMP_HERMES_HOME="$(mktemp -d)"
          HERMES_HOME="$TMP_HERMES_HOME" bash scripts/install-hermes-commerce-control.sh --skip-deps --skip-register
          test -x "$TMP_HERMES_HOME/commerce-control/commerce-control-cli.sh"
          test -x "$TMP_HERMES_HOME/commerce-control/commerce-control-mcp.sh"
          TMP_WORKSPACE="$(mktemp -d)"
          TMP_HERMES_HOME_PINNED="$(mktemp -d)"
          HERMES_HOME="$TMP_HERMES_HOME_PINNED" bash scripts/install-hermes-commerce-control.sh --skip-deps --skip-register --workspace "$TMP_WORKSPACE"
          grep -Fq "COMMERCE_REPO_ROOT" "$TMP_HERMES_HOME_PINNED/commerce-control/commerce-control-cli.sh"
          echo 'ISOLATED_INSTALLER=PASS'
