services:
  - type: web
    name: hermes-counterparty-api
    runtime: docker
    plan: free
    branch: feat/hermes-commerce-control-plane
    rootDir: products/drafts/data-quality-profiler
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: X402_ENABLED
        value: "true"
      - key: X402_NETWORK
        value: eip155:8453
      - key: ALLOW_MAINNET
        value: "true"
      - key: X402_PRICE
        value: "$0.02"
      - key: X402_LOCALE_PRICE
        value: "$0.03"
      - key: X402_PAY_TO
        value: 0x2BD7c4e294B09E9a853168a58712498D03A45B01
      - key: X402_FACILITATOR_MODE
        value: xpay
      - key: X402_FACILITATOR_URL
        value: https://facilitator.xpay.sh
