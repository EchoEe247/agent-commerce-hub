name: Product 13 Patch Seam

on:
  push:
    branches:
      - feat/product13-package-maintenance
    paths:
      - '.github/workflows/product13-patch-seam.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product13-package-maintenance
      - name: Apply Product 13 commercial patch
        run: python .github/scripts/product13-commercial-patch.py
      - name: Commit Product 13 commercial surfaces
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add products/drafts/data-quality-profiler/src/app.mjs products/drafts/data-quality-profiler/src/openapi.mjs products/drafts/data-quality-profiler/src/payments/x402-plugin.mjs
            git commit -m 'feat: publish Product 13 commercial surfaces'
            git push origin HEAD:feat/product13-package-maintenance
          fi
