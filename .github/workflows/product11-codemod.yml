name: Product 11 Codemod

on:
  push:
    branches:
      - feat/sec-company-snapshot
    paths:
      - '.github/workflows/product11-codemod.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sec-company-snapshot
      - name: Advance permanent portfolio assertions to Product 11
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('products/drafts/data-quality-profiler/test/openapi-discovery.test.mjs')
          s = p.read_text()
          if '["/v1/sec-company-snapshot", "secCompanySnapshot", "0.020000"]' not in s:
              s = s.replace('  ["/v1/company-domain-intelligence", "companyDomainIntelligence", "0.020000"],\n', '  ["/v1/company-domain-intelligence", "companyDomainIntelligence", "0.020000"],\n  ["/v1/sec-company-snapshot", "secCompanySnapshot", "0.020000"],\n', 1)
          if 'x402SecCompanyPrice: "$0.02"' not in s:
              s = s.replace('      x402CompanyDomainPrice: "$0.02",\n', '      x402CompanyDomainPrice: "$0.02",\n      x402SecCompanyPrice: "$0.02",\n', 1)
          s = s.replace('publishes ten AgentCash-compatible x402 operations', 'publishes eleven AgentCash-compatible x402 operations')
          s = s.replace('/ten POST operations/i', '/eleven POST operations/i')
          p.write_text(s)

          p = Path('products/drafts/data-quality-profiler/test/counterparty-api.test.mjs')
          s = p.read_text()
          if '["/v1/sec-company-snapshot", "sec-company-snapshot-edgar-filings-xbrl", 0.02' not in s:
              s = s.replace('  ["/v1/company-domain-intelligence", "company-domain-intelligence-dns-rdap-mail-website", 0.02, /domain|DNS|RDAP/i],\n', '  ["/v1/company-domain-intelligence", "company-domain-intelligence-dns-rdap-mail-website", 0.02, /domain|DNS|RDAP/i],\n  ["/v1/sec-company-snapshot", "sec-company-snapshot-edgar-filings-xbrl", 0.02, /SEC|EDGAR/i],\n', 1)
          if 'x402SecCompanyPrice: "$0.02"' not in s:
              s = s.replace('      x402CompanyDomainPrice: "$0.02",\n', '      x402CompanyDomainPrice: "$0.02",\n      x402SecCompanyPrice: "$0.02",\n', 1)
          s = s.replace('publishes ten unique Agent402-compatible tools', 'publishes eleven unique Agent402-compatible tools')
          s = s.replace('assert.equal(body.resources.length, 10);', 'assert.equal(body.resources.length, 11);')
          s = s.replace('assert.equal(new Set(body.resources.map((resource) => resource.url)).size, 10);', 'assert.equal(new Set(body.resources.map((resource) => resource.url)).size, 11);')
          if '{ url: `${PUBLIC_ORIGIN}/v1/sec-company-snapshot`, method: "POST" },' not in s:
              s = s.replace('    { url: `${PUBLIC_ORIGIN}/v1/company-domain-intelligence`, method: "POST" },\n', '    { url: `${PUBLIC_ORIGIN}/v1/company-domain-intelligence`, method: "POST" },\n    { url: `${PUBLIC_ORIGIN}/v1/sec-company-snapshot`, method: "POST" },\n', 1)
          s = s.replace('assert.equal(body.capabilities.tools, 10);', 'assert.equal(body.capabilities.tools, 11);')
          s = s.replace('find((category) => category.key === "business-intelligence").tools, 2);', 'find((category) => category.key === "business-intelligence").tools, 3);')
          s = s.replace('assert.equal(body.endpoints.length, 10);', 'assert.equal(body.endpoints.length, 11);')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add products/drafts/data-quality-profiler/test/openapi-discovery.test.mjs products/drafts/data-quality-profiler/test/counterparty-api.test.mjs
          git commit -m 'test: advance portfolio assertions to Product 11' || true
          git push origin HEAD:feat/sec-company-snapshot
# retrigger-regressions
