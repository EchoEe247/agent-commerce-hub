name: Verify Batch 1 Distribution

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify live eight-product x402 surface
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://hermes-counterparty-api.onrender.com'

          curl -fsS "$ORIGIN/.well-known/x402" -o /tmp/manifest.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/manifest.json'))
          assert d['capabilities']['tools'] == 8, d['capabilities']
          assert len(d['resources']) == 8, d['resources']
          print('LIVE_MANIFEST_TOOLS=', d['capabilities']['tools'])
          print('LIVE_MANIFEST_PRICE_RANGE=', d['payment']['x402']['priceRange'])
          for e in d['endpoints']:
              print('LIVE_ENDPOINT', e['method'], e['path'], e['price_usd'], e['network'])
          PY

          probe() {
            local path="$1" body="$2"
            local headers bodyfile code
            headers="$(mktemp)"; bodyfile="$(mktemp)"
            code="$(curl -sS -D "$headers" -o "$bodyfile" -w '%{http_code}' \
              -X POST "$ORIGIN$path" -H 'Content-Type: application/json' --data "$body")"
            header_ok=false
            if grep -qi '^payment-required:' "$headers"; then header_ok=true; fi
            echo "LIVE_402 $path status=$code payment_required_header=$header_ok"
            test "$code" = "402"
            test "$header_ok" = "true"
            rm -f "$headers" "$bodyfile"
          }

          probe '/v1/counterparty-availability' '{"country_code":"US","timezone":"America/Chicago"}'
          probe '/v1/profile' '{"format":"json","records":[{"id":1},{"id":2}]}'
          probe '/v1/duplicate-audit' '{"format":"json","records":[{"id":1},{"id":1}]}'
          probe '/v1/quality-gate' '{"format":"json","records":[{"id":1},{"id":2}]}'
          probe '/v1/schema-drift' '{"baseline":{"format":"json","records":[{"id":1}]},"current":{"format":"json","records":[{"id":1,"name":"A"}]}}'
          probe '/v1/data-contract-check' '{"dataset":{"format":"json","records":[{"id":1}]},"contract":{"required_fields":["id"],"field_types":{"id":"integer"},"allow_extra_fields":true}}'
          probe '/v1/clean-normalize' '{"format":"json","records":[{"id":1,"name":" Alice "},{"id":1,"name":"Alice"}]}'
          probe '/v1/repair-plan' '{"format":"json","records":[{"id":1},{"id":1}]}'

      - name: Inspect Agent402 current seller state
        shell: bash
        run: |
          set -euo pipefail
          curl --max-time 30 -fsS \
            'https://agent402.tools/api/index?seller=hermes-counterparty-api.onrender.com' \
            -o /tmp/agent402.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/agent402.json'))
          print('AGENT402_ORIGIN=', d.get('origin'))
          print('AGENT402_TOOL_COUNT=', d.get('toolCount'))
          print('AGENT402_HEALTH=', d.get('health'))
          print('AGENT402_ROUTABLE=', d.get('routable'))
          print('AGENT402_ERROR=', d.get('error'))
          for method,route,price in sorted({(t.get('method'),t.get('route'),t.get('price')) for t in d.get('tools',[])}):
              print('AGENT402_ROUTE', method, route, price)
          PY

      - name: Inspect 402 Index listing coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request

          expected = [
            ('https://hermes-counterparty-api.onrender.com/v1/counterparty-availability', 'Counterparty Availability & Contact Window'),
            ('https://hermes-counterparty-api.onrender.com/v1/profile', 'Data Quality'),
            ('https://hermes-counterparty-api.onrender.com/v1/duplicate-audit', 'JSON CSV Duplicate Row Audit'),
            ('https://hermes-counterparty-api.onrender.com/v1/quality-gate', 'ETL RAG Data Quality Pass Fail Gate'),
            ('https://hermes-counterparty-api.onrender.com/v1/schema-drift', 'Schema Drift Detector'),
            ('https://hermes-counterparty-api.onrender.com/v1/data-contract-check', 'Data Contract Compatibility Check'),
            ('https://hermes-counterparty-api.onrender.com/v1/clean-normalize', 'JSON CSV Clean Normalize Deduplicate'),
            ('https://hermes-counterparty-api.onrender.com/v1/repair-plan', 'Deterministic Dataset Repair Plan'),
          ]

          found = set()
          for target, query in expected:
              url = 'https://402index.io/api/v1/services?' + urllib.parse.urlencode({
                  'q': query,
                  'verified': 'true',
                  'limit': 50,
              })
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = json.load(r)
              matches = [s for s in data.get('services', []) if s.get('url') == target]
              if matches:
                  s = matches[0]
                  found.add(target)
                  print('INDEX402_FOUND', target, 'id='+str(s.get('id')), 'domain_verified='+str(s.get('domain_verified')), 'payment_valid='+str(s.get('x402_payment_valid')), 'health='+str(s.get('health_status')), 'price='+str(s.get('price_usd')))
              else:
                  print('INDEX402_MISSING', target)

          print('INDEX402_COVERAGE=', len(found), '/', len(expected))
          PY
