name: Distribution Final Verify

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current Agent402 catalog and router
        run: |
          node <<'NODE'
          const host='hermes-counterparty-api.onrender.com';
          const marketplace=await fetch('https://agent402.tools/marketplace?all=1',{headers:{'user-agent':'hermes-agent402-verify/1.0'}});
          const html=await marketplace.text();
          const idx=html.indexOf(host);
          const context=idx>=0?html.slice(Math.max(0,idx-1200),idx+1800):'';
          const toolMatch=context.match(/Base[^\n<]{0,120}?(\d+)\s+tools/i);
          console.log(JSON.stringify({source:'marketplace',status:marketplace.status,found:idx>=0,toolCount:toolMatch?Number(toolMatch[1]):null,context:context.replace(/\s+/g,' ').slice(0,1800)}));
          if (idx<0) throw new Error('Hermes seller missing from current Agent402 full marketplace');

          const queries=['Hermes Company Domain Intelligence','company domain intelligence','research company domain','enrich a business domain','qualify a lead company domain'];
          for (const q of queries) {
            const r=await fetch(`https://agent402.tools/api/find?q=${encodeURIComponent(q)}`,{headers:{'user-agent':'hermes-agent402-verify/1.0'}});
            const parsed=await r.json();
            const results=Array.isArray(parsed.results)?parsed.results:[];
            const text=JSON.stringify(parsed);
            console.log(JSON.stringify({source:'router',q,status:r.status,count:parsed.count??results.length,hasHermes:text.includes(host),hasCompany:text.includes('/v1/company-domain-intelligence'),top:results.slice(0,5).map((x,i)=>({rank:i+1,name:x.name,route:x.route,origin:x.origin??x.sellerOrigin??x.host??null,price:x.price}))}));
          }
          NODE
