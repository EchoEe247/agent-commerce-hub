name: x402scan Refresh

on:
  pull_request:
    branches:
      - feat/hermes-commerce-control-plane

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm registration route is SIWX-only and free
        run: |
          node <<'NODE'
          const url = 'https://x402scan.com/api/x402/registry/register-origin';
          const origin = 'https://hermes-counterparty-api.onrender.com';
          const r = await fetch(url, {
            method: 'POST',
            headers: {'content-type':'application/json','user-agent':'hermes-x402scan-preflight/1.0'},
            body: JSON.stringify({origin})
          });
          const body = await r.text();
          let parsed = null;
          try { parsed = JSON.parse(body); } catch {}
          const text = (parsed ? JSON.stringify(parsed) : body).toLowerCase();
          const paymentRequired = r.headers.get('payment-required');
          let headerDecoded = null;
          if (paymentRequired) {
            try { headerDecoded = JSON.parse(Buffer.from(paymentRequired,'base64').toString('utf8')); } catch {}
          }
          const combined = `${text} ${JSON.stringify(headerDecoded ?? {}).toLowerCase()}`;
          const hasSiwx = combined.includes('sign-in-with-x') || combined.includes('siwx');
          const accepts = headerDecoded?.accepts ?? parsed?.accepts ?? [];
          const hasPaidAccept = Array.isArray(accepts) && accepts.length > 0;
          console.log(JSON.stringify({status:r.status,hasSiwx,hasPaidAccept,acceptCount:Array.isArray(accepts)?accepts.length:null,challenge:headerDecoded,body:parsed ?? body.slice(0,3000)}));
          if (r.status !== 402) throw new Error(`expected unauthenticated 402, got ${r.status}`);
          if (!hasSiwx) throw new Error('registration challenge is not SIWX');
          if (hasPaidAccept) throw new Error('registration challenge advertises a paid x402 option; refusing mutation');
          NODE
